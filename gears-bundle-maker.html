  const ok = !!findAsset(type, name);
  return el(
    'div',
    { class: 'stage ' + (ok ? 'ok' : 'miss') },
    el('div', { class: 'k', text: label + (ok ? '' : ' - not in bundle') }),
    el('div', { class: 'v', text: name })
  );
}
function buildTextView(asset) {
  const tv = $('#textView');
  tv.textContent = '';
  if (!asset) return;
  if (asset.type === 'Shader') {
    const s = asset.sh,
      row = el('div', { class: 'pipe' });
    if (s.Drawable) {
      row.append(stageBox('Vertex', s.Vertex, 'RawShader'), el('div', { class: 'wire' }));
      if (s.Geometry) row.append(stageBox('Geometry', s.Geometry, 'RawShader'), el('div', { class: 'wire' }));
      row.append(stageBox('Fragment', s.Fragment, 'RawShader'));
    } else row.append(stageBox('Compute', s.Compute, 'RawShader'));
    tv.append(row, el('div', { style: 'height:18px' }), codeView(shToJson(asset), 'json'));
  } else if (asset.type === 'Scene') {
    let j = null;
    try {
      j = JSON.parse(asset.text || '');
    } catch (e) {
      tv.append(el('div', { class: 'note err', text: 'Invalid JSON: ' + e.message }));
    }
    if (j && isObj(j.Root)) tv.append(sceneTree(j));
    else if (j) tv.append(el('div', { class: 'note warn', text: 'No "Root" object in this scene.' }));
    tv.append(el('div', { style: 'height:18px' }), codeView(asset.text || '', 'json'));
  } else if (asset.type === 'Component') {
    tv.append(codeView(asset.text || '', 'cs'));
  } else if (asset.type === 'RawShader') tv.append(codeView(asset.text || '', 'glsl'));
  else if (asset.type === 'Material' || asset.type === 'Model') {
    tv.append(el('div', { class: 'note warn', text: 'WebGL2 is not available, so there is no 3D preview.' }));
    if (asset.type === 'Model') {
      const o = getObj(asset);
      tv.append(el('div', { class: 'note', text: o.stats.tris + ' triangles, ' + o.stats.v + ' vertices.' }));
    } else tv.append(codeView(matToJson(asset), 'json'));
  }
}

function frameView() {
  const a = state.sel;
  if (!a || !initGL()) return;
  const mesh = a.type === 'Material' ? primMesh(viewer.shape) : a.type === 'Model' ? modelMesh(a) : null;
  if (mesh) {
    frameCamera(mesh.radius, mesh.center);
    viewer.cam.yaw = 0.7;
    viewer.cam.pitch = 0.28;
  }
}
function showAsset() {
  const asset = state.sel,
    title = $('#viewTitle');
  title.textContent = '';
  if (!asset) {
    title.textContent = 'No asset selected';
    viewMode('empty');
    buildViewTools();
    return;
  }
  title.append(
    asset.name,
    el('small', { text: TYPE[asset.type].label + (asset.ref ? '  -  reference' : '') })
  );
  viewer.tv.fitted = false;
  viewer.tv.chan = 'RGBA';
  $('#viewInfo').textContent = '';
  if (asset.type === 'Material') viewer.cull = 'material'; // a material preview follows the material's own cull mode
  if (asset.type === 'Texture') {
    viewMode('2d');
    ensureImage(asset);
  } else if (asset.type === 'Model' || asset.type === 'Material') {
    if (initGL()) {
      viewMode('gl');
      for (const s of asset.type === 'Material' ? asset.mat.Textures : []) {
        const textureAsset = findAsset('Texture', s.TextureName);
        if (textureAsset) ensureImage(textureAsset);
      }
      if (asset.type === 'Model')
        for (const mn of getObj(asset).mats) {
          const materialAsset = findAsset('Material', mn);
          if (materialAsset)
            for (const s of materialAsset.mat.Textures) {
              const textureAsset = findAsset('Texture', s.TextureName);
              if (textureAsset) ensureImage(textureAsset);
            }
        }
      frameView();
      const o = asset.type === 'Model' ? getObj(asset) : null;
      $('#viewInfo').textContent = o
        ? o.stats.tris + ' triangles  ' + o.stats.v + ' vertices  ' + o.subs.length + ' sub-mesh(es)'
        : '';
    } else {
      buildTextView(asset);
      viewMode('text');
    }
  } else {
    buildTextView(asset);
    viewMode('text');
  }
  buildViewTools();
  redraw();
}
function renderView() {
  if (viewer.mode === 'gl' && viewer.gl) drawGL();
  else if (viewer.mode === '2d') drawTexture();
}
function redraw() {
  if (viewer.raf) return;
  viewer.raf = requestAnimationFrame(() => {
    viewer.raf = 0;
    renderView();
  });
}

function bindViewInput() {
  for (const canvas of [$('#gl'), $('#c2d')]) {
    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      viewer.drag = { x: e.clientX, y: e.clientY, btn: e.button, shift: e.shiftKey };
    });
    canvas.addEventListener('pointerup', () => {
      viewer.drag = null;
    });
    canvas.addEventListener('pointercancel', () => {
      viewer.drag = null;
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('pointermove', e => {
      const d = viewer.drag;
      if (!d) return;
      const dx = e.clientX - d.x,
        dy = e.clientY - d.y;
      d.x = e.clientX;
      d.y = e.clientY;
      if (canvas.id === 'c2d') {
        viewer.tv.x += dx;
        viewer.tv.y += dy;
        redraw();
        return;
      }
      const c = viewer.cam;
      if (d.btn === 1 || d.btn === 2 || d.shift) {
        const k = c.dist * 0.0016,
          sy = Math.sin(c.yaw),
          cy = Math.cos(c.yaw),
          sp = Math.sin(c.pitch),
          cp = Math.cos(c.pitch);
        c.t[0] += -dx * k * cy + dy * k * (-sp * sy);
        c.t[1] += dy * k * cp;
        c.t[2] += dx * k * sy + dy * k * (-sp * cy);
      } else {
        c.yaw -= dx * 0.008;
        c.pitch = Math.max(-1.5, Math.min(1.5, c.pitch + dy * 0.008));
      }
      redraw();
    });
    canvas.addEventListener(
      'wheel',
      e => {
        e.preventDefault();
        if (canvas.id === 'c2d') {
          viewer.tv.scale = Math.max(0.02, Math.min(64, viewer.tv.scale * Math.exp(-e.deltaY * 0.0016)));
          viewer.tv.fitted = true;
        } else
          viewer.cam.dist = Math.max(
            viewer.cam.radius * 0.15,
            Math.min(viewer.cam.radius * 14, viewer.cam.dist * Math.exp(e.deltaY * 0.0016))
          );
        redraw();
      },
      { passive: false }
    );
    canvas.addEventListener('dblclick', () => {
      if (canvas.id === 'c2d') viewer.tv.fitted = false;
      else frameView();
      redraw();
    });
  }
  if (window.ResizeObserver) new ResizeObserver(() => redraw()).observe($('#viewport'));
}

// ---------- folder tree ----------
const tkey = (ref, path) => '@' + (ref || '') + (path ? ':' + path : '');
function navIs(ref, path) {
  return (state.nav.ref || null) === (ref || null) && state.nav.path === path;
}
function goto(ref, path) {
  state.nav = { ref: ref || null, path };
  state.filter = '';
  $('#search').value = '';
  renderTree();
  renderTiles();
  renderCrumbs();
}

function treeRow(label, ico, depth, key, hasKids, sel, onclick, stub) {
  const open = state.open.has(key);
  const r = el(
    'div',
    {
      class: 'trow' + (sel ? ' sel' : '') + (stub ? ' stub' : ''),
      style: 'padding-left:' + (8 + depth * 14) + 'px',
      role: 'treeitem',
      onclick
    },
    el(
      'span',
      {
        class: 'chev ' + (hasKids ? (open ? '' : 'closed') : 'none'),
        onclick: e => {
          e.stopPropagation();
          if (open) state.open.delete(key);
          else state.open.add(key);
          renderTree();
        }
      },
      icon('chev', '')
    ),
    icon(ico),
    el('span', { class: 'nm', text: label, title: label })
  );
  r.querySelector('.chev svg').style.cssText = 'width:10px;height:10px';
  return r;
}
function addDrop(row, path) {
  row.addEventListener('dragover', e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('application/x-gbm-asset')) {
      e.preventDefault();
      row.classList.add('drop');
    }
  });
  row.addEventListener('dragleave', () => row.classList.remove('drop'));
  row.addEventListener('drop', e => {
    row.classList.remove('drop');
    const id = e.dataTransfer.getData('application/x-gbm-asset');
    if (!id) return;
    e.preventDefault();
    e.stopPropagation();
    const a = state.assets.find(x => x.id === id);
    if (a) {
      moveAsset(a, path);
      refreshAll();
    }
  });
}
function subtree(out, ref, folderSet, path, depth) {
  const kids = Array.from(folderSet)
    .filter(p => parentPath(p) === path)
    .sort((a, b) => a.localeCompare(b));
  for (const p of kids) {
    const key = tkey(ref, p),
      hasKids = Array.from(folderSet).some(q => parentPath(q) === p);
    const row = treeRow(p.slice(p.lastIndexOf('/') + 1), 'folder', depth, key, hasKids, navIs(ref, p), () =>
      goto(ref, p)
    );
    if (!ref) addDrop(row, p);
    out.append(row);
    if (state.open.has(key)) subtree(out, ref, folderSet, p, depth + 1);
  }
}
function renderTree() {
  const t = $('#tree');
  t.textContent = '';
  const rk = tkey(null, ''),
    has = allFolders().size > 0;
  const root = treeRow(state.bundle.name || 'Bundle', 'bundle', 0, rk, has, navIs(null, ''), () =>
    goto(null, '')
  );
  addDrop(root, '');
  t.append(root);
  if (state.open.has(rk)) subtree(t, null, allFolders(), '', 1);
  if (state.refs.length || state.bundle.refList.length) {
    t.append(el('div', { class: 'tsec', text: 'Reference bundles' }));
    for (const l of state.bundle.refList) {
      const r = state.refs.find(x => x.uuid === l.uuid),
        key = tkey(l.uuid, '');
      if (!r) {
        t.append(
          treeRow(
            (l.name || 'Unnamed') + ' (not loaded)',
            'lock',
            0,
            key,
            false,
            false,
            () => addReference(),
            true
          )
        );
        continue;
      }
      const fs = refFolders(r);
      t.append(treeRow(r.name, 'lock', 0, key, fs.size > 0, navIs(r.uuid, ''), () => goto(r.uuid, '')));
      if (state.open.has(key)) subtree(t, r.uuid, fs, '', 1);
    }
  }
}

function renderCrumbs() {
  const c = $('#crumbs');
  c.textContent = '';
  const ref = state.nav.ref ? state.refs.find(x => x.uuid === state.nav.ref) : null;
  const add = (label, path) => {

  $('#btnRenFolder').disabled = !(mine && state.nav.path);
  $('#btnDelFolder').disabled = !(mine && state.nav.path);

// The slot used as a material's picture: the albedo texture, otherwise the first texture that exists.
function primaryTexture(material) {
  const slots = material.mat.Textures;
  const albedo = slots.find(
    slot => /albedo|base|diffuse|colou?r/i.test(slot.SemanticName) && findAsset('Texture', slot.TextureName)
  );
  const slot = albedo || slots.find(s => findAsset('Texture', s.TextureName));
  return slot ? findAsset('Texture', slot.TextureName) : null;
}

function materialThumb(material) {
  const size = 68,
    canvas = el('canvas', { width: size, height: size });
  const base = material.mat.BaseColor;
  const paint = image => {
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, 30, 0, Math.PI * 2);
    ctx.clip();
    if (image) {
      const scale = Math.max(60 / image.width, 60 / image.height);
      ctx.drawImage(
        image,
        (size - image.width * scale) / 2,
        (size - image.height * scale) / 2,
        image.width * scale,
        image.height * scale
      );
      ctx.globalCompositeOperation = 'multiply'; // the base color tints the texture, as in the engine
    }
    ctx.fillStyle = toHex(base);
    ctx.fillRect(0, 0, size, size);
    ctx.globalCompositeOperation = 'source-over';
    const light = ctx.createRadialGradient(24, 22, 3, 34, 34, 34);
    light.addColorStop(0, 'rgba(255,255,255,0.40)');
    light.addColorStop(0.45, 'rgba(255,255,255,0)');
    light.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = light;
    ctx.fillRect(0, 0, size, size);
    ctx.restore();
  };
  const texture = primaryTexture(material);
  paint(texture && texture._img ? texture._img : null);
  if (texture && !texture._img)
    ensureImage(texture).then(image => {
      if (image) paint(image);
    });
  return canvas;
}

function thumbFor(asset) {
  const box = el('div', { class: 'thumb' });
  if (asset.type === 'Texture') {
    const canvas = el('canvas', { width: 68, height: 68 });
    const draw = img => {
      if (!img) return;
      const x = canvas.getContext('2d'),
        s = Math.min(68 / img.width, 68 / img.height);
      if (!x) return;
      x.clearRect(0, 0, 68, 68);
      x.drawImage(img, (68 - img.width * s) / 2, (68 - img.height * s) / 2, img.width * s, img.height * s);
    };
    if (asset._img) draw(asset._img);
    else ensureImage(asset).then(draw);
    box.append(canvas);
  } else if (asset.type === 'Material') box.append(materialThumb(asset));
  else box.append(icon(asset.type));
  return box;
}
function assetTile(asset) {
  const sev = asset.ref ? '' : worst(asset);
  const t = el(
    'div',
    {
      class: 'tile' + (state.sel === asset ? ' sel' : ''),
      draggable: asset.ref ? false : 'true',
      title: TYPE[asset.type].label + ': ' + asset.name,
      onclick: () => select(asset)
    },
    thumbFor(asset),
    el('div', { class: 'nm', text: asset.name }),
    sev ? el('span', { class: 'dot ' + sev }) : null,
    state.pin === asset ? el('span', { class: 'pinmark' }, icon('pin')) : null,
    asset.ref ? el('span', { class: 'lock' }, icon('lock')) : null
  );
  t.addEventListener('dragstart', e => {
    e.dataTransfer.setData('application/x-gbm-asset', asset.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  return t;
}
function renderTiles() {
  renderCrumbs();
  const box = $('#tiles');
  box.textContent = '';
  const f = state.filter.trim().toLowerCase();
  if (f) {
    const hits = allAssets().filter(a => a.name.toLowerCase().includes(f));
    if (!hits.length) box.append(el('div', { class: 'empty', text: 'No matches.' }));
    for (const a of hits) box.append(assetTile(a));
    return;
  }
  const ref = state.nav.ref ? state.refs.find(x => x.uuid === state.nav.ref) : null;
  const list = ref ? ref.assets : state.assets,
    fset = ref ? refFolders(ref) : allFolders(),
    path = state.nav.path;
  const subs = Array.from(fset)
    .filter(p => parentPath(p) === path)
    .sort((a, b) => a.localeCompare(b));
  for (const p of subs) {
    const t = el(
      'div',
      {
        class: 'tile',
        title: p,
        onclick: () => {
          state.open.add(tkey(state.nav.ref, path));
          goto(state.nav.ref, p);
        }
      },
      el('div', { class: 'thumb' }, icon('folder')),
      el('div', { class: 'nm', text: p.slice(p.lastIndexOf('/') + 1) })
    );
    if (!ref) addDrop(t, p);
    box.append(t);
  }
  const here = list
    .filter(asset => asset.folder === path)
    .sort((a, b) =>
      a.type === b.type
        ? a.name.localeCompare(b.name)
        : TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type)
    );
  for (const a of here) box.append(assetTile(a));
  if (!subs.length && !here.length) {
    box.append(
      el('div', {
        class: 'empty',
        text:
          !ref && !state.assets.length && !path
            ? 'Empty. Drop files here or use Import assets.'
            : 'Empty folder.'
      })
    );
  }
}

// ---------- settings panel helpers ----------
const toHex = v =>
  '#' +
  [0, 1, 2]
    .map(i =>
      Math.round(Math.max(0, Math.min(1, v[i])) * 255)
        .toString(16)
        .padStart(2, '0')
    )
    .join('');
function fromHex(hex, v) {
  v[0] = parseInt(hex.slice(1, 3), 16) / 255;
  v[1] = parseInt(hex.slice(3, 5), 16) / 255;
  v[2] = parseInt(hex.slice(5, 7), 16) / 255;
}
const row = (label, ctrl, cls) =>
  el('div', { class: 'row' + (cls ? ' ' + cls : '') }, el('label', { text: label, title: label }), ctrl);
function secEl(title, extra) {

  s.append(el('h3', null, title, el('span', { class: 'grow' }), extra || null));
  return s;
}

function inText(get, set, o) {

function inNum(get, set, o) {

function inRange(get, set, min, max, step) {
  const rg = el('input', { type: 'range', min, max, step, value: get() }),
    nm = el('input', { type: 'number', min, max, step, value: r6(get()) });
  const fill = () => rg.style.setProperty('--p', ((parseFloat(rg.value) - min) / (max - min)) * 100 + '%');
  fill();
  rg.addEventListener('input', () => {
    const v = parseFloat(rg.value);
    nm.value = r6(v);
    fill();
    set(v);
  });
  nm.addEventListener('input', () => {
    const v = parseFloat(nm.value);
    if (Number.isFinite(v)) {
      rg.value = v;
      fill();
      set(v);
    }
  });
  return el('div', { class: 'pair' }, rg, nm);
}
function inSelect(get, set, opts) {
  const s = el('select', { onchange: e => set(e.target.value) });
  for (const o of opts) {
    const [v, l] = Array.isArray(o) ? o : [o, o];
    s.append(el('option', { value: v, text: l }));

function inPair(arr, set, step) {

// Sampler and format settings. Changing a value updates the controls in place, so the panel never rebuilds or collapses.
function samplerSection(slot, ui, onChange) {
  const SAMPLER_LABELS = { wrap: 'Wrap', filter: 'Filter', mipmap: 'Mipmap' };
  const FORMAT_LABELS = { pixel: 'Pixel format', target: 'Target', comps: 'Color components' };
  const choices = field => [['', '(default)']].concat(ENUM[field].map(value => [value, value]));
  const controls = {};

  const summary = el('summary');
  const presetSelect = el(
    'select',
    {
      onchange: e => {
        if (e.target.value !== 'custom') {
          applySampler(slot, e.target.value);
          onChange();
          sync();
        }
      }
    },
    SAMPLER_PRESETS.map(([id, label]) => el('option', { value: id, text: label })),
    el('option', { value: 'custom', text: 'Custom' })
  );

  const grid = el(
    'div',
    { class: 'samp' },
    el('div', { class: 'full' }, el('label', { text: 'Preset' }), presetSelect)
  );
  for (const field of SAMPLER_FIELDS) {
    controls[field] = inSelect(
      () => slot[field],
      value => {
        slot[field] = value;
        onChange();
        sync();
      },
      choices(field)
    );
    grid.append(el('div', null, el('label', { text: SAMPLER_LABELS[field] }), controls[field]));
  }

  const pixelNote = el('div', {
    class: 'full note warn',
    text: 'Not Rgba: the engine reads its RGBA data in this format, so the image is distorted.'
  });
  const compsNote = el('div', { class: 'full note', text: 'The engine does not use Color components.' });
  const syncNotes = () => {
    pixelNote.hidden = !slot.pixel || slot.pixel === 'Rgba';
    compsNote.hidden = !slot.comps;
  };
  const formatGrid = el('div', { class: 'samp' }, pixelNote, compsNote);
  for (const field of FORMAT_FIELDS) {
    controls[field] = inSelect(
      () => slot[field],
      value => {
        slot[field] = value;
        onChange();
        syncNotes();
      },
      choices(field)
    );
    formatGrid.append(el('div', null, el('label', { text: FORMAT_LABELS[field] }), controls[field]));
  }
  const formatDetails = el('details', { open: ui.formatOpen }, el('summary', { text: 'Format' }), formatGrid);
  formatDetails.addEventListener('toggle', () => {
    ui.formatOpen = formatDetails.open;
  });

  function sync() {
    const preset = samplerPresetOf(slot);
    presetSelect.value = preset;
    summary.textContent =
      'Sampler: ' + (preset === 'custom' ? 'custom' : SAMPLER_PRESETS.find(p => p[0] === preset)[1]);
    for (const field of SAMPLER_FIELDS) controls[field].value = slot[field];
  }
  sync();
  syncNotes();

  const details = el('details', { open: ui.samplerOpen }, summary, grid, formatDetails);
  details.addEventListener('toggle', () => {
    ui.samplerOpen = details.open;
  });
  return details;
}

function slotCard(a, material, slot, i, onChange) {
  const ui = slotState(slot);
  const textureAsset = findAsset('Texture', slot.TextureName);
  const thumb = el('div', {
    class: 'thumb big' + (textureAsset ? '' : ' none'),
    title: textureAsset ? 'Show in viewer' : '',
    onclick: () => {
      if (textureAsset) select(textureAsset);
    }
  });
  if (textureAsset) {
    const canvas = el('canvas', { width: 64, height: 64 });
    const dr = img => {
      if (!img) return;
      const x = canvas.getContext('2d'),
        k = Math.min(64 / img.width, 64 / img.height);
      x.clearRect(0, 0, 64, 64);
      x.drawImage(img, (64 - img.width * k) / 2, (64 - img.height * k) / 2, img.width * k, img.height * k);
    };
    if (textureAsset._img) dr(textureAsset._img);
    else ensureImage(textureAsset).then(dr);
    thumb.append(canvas);
  } else thumb.append(icon('Texture'));

  const knownType = TEX_TYPES.some(t => t[0] === slot.SemanticName) && !ui.customType;

function extraSection(panel, asset) {
  const presets = EXTRA_PRESETS[asset.type] || [];
  const section = secEl(
    'Extra metadata',
    el('button', {
      class: 'btn small',
      text: 'Add custom',
      onclick: () => {
        asset.extra.push({ k: '', v: '' });
        touch(asset);
        renderInspector();
      }
    })
  );
  const kind = v => (typeof v === 'boolean' ? 'bool' : typeof v === 'number' ? 'number' : 'text');
  asset.extra.forEach((e, i) => {
    const pr = presets.find(p => p.k === e.k);
    let val;
    if (pr && pr.kind === 'enum') {
      const opts = pr.opts.slice();
      if (!opts.some(o => o === e.v)) opts.push(e.v);
      val = el(
        'select',
        {
          onchange: ev => {
            const raw = ev.target.value,
              n = Number(raw);
            e.v = typeof pr.opts[0] === 'number' ? n : raw;
            touch(asset);
          }
        },
        opts.map(o => el('option', { value: o, text: String(o), selected: o === e.v }))
      );
    } else if ((pr && pr.kind === 'bool') || kind(e.v) === 'bool')
      val = el('input', {
        type: 'checkbox',
        checked: !!e.v,
        onchange: ev => {
          e.v = ev.target.checked;
          touch(asset);
        }
      });
    else if ((pr && pr.kind === 'number') || kind(e.v) === 'number')
      val = el('input', {
        type: 'number',
        step: 'any',
        value: e.v,
        oninput: ev => {
          const n = parseFloat(ev.target.value);
          if (Number.isFinite(n)) {
            e.v = n;
            touch(asset);
          }
        }
      });
    else
      val = el('input', {
        type: 'text',
        value: e.v,
        oninput: ev => {
          e.v = ev.target.value;
          touch(asset);
        }
      });
    const typeCell = pr
      ? el('span', { class: 'note', text: 'preset' })
      : el(
          'select',
          {
            onchange: ev => {
              const k = ev.target.value;
              e.v = k === 'bool' ? false : k === 'number' ? 0 : String(e.v);
              touch(asset);
              renderInspector();
            }
          },
          [
            ['text', 'Text'],
            ['number', 'Number'],
            ['bool', 'Yes/no']
          ].map(([v, l]) => el('option', { value: v, text: l, selected: kind(e.v) === v }))
        );
    section.append(
      el(
        'div',
        { class: 'xrow' },
        el('input', {
          type: 'text',
          value: e.k,
          placeholder: 'key',
          oninput: ev => {
            e.k = ev.target.value;
            touch(asset);
          }
        }),
        typeCell,
        val,
        el(
          'button',
          {
            class: 'icon-btn',
            title: 'Remove',
            onclick: () => {
              asset.extra.splice(i, 1);
              touch(asset);
              renderInspector();
            }
          },
          icon('x')
        )
      )
    );
  });
  const missing = presets.filter(p => !asset.extra.some(e => e.k === p.k));
  if (missing.length) {
    const sug = el('div', { class: 'sug' });
    for (const p of missing)
      sug.append(
        el('button', {
          class: 'btn small',
          text: '+ ' + p.k,
          title: p.kind === 'enum' ? p.opts.join(', ') : p.kind,
          onclick: () => {
            asset.extra.push({ k: p.k, v: p.v });
            touch(asset);
            renderInspector();
          }
        })
      );
    section.append(sug);
  }
  panel.append(section);
}

  }

// ---------- review dialog ----------
let reviewTab = 'problems';
function renderReview() {
  const body = $('#reviewBody');
  body.textContent = '';
  for (const t of document.querySelectorAll('#review .tab'))
    t.classList.toggle('on', t.dataset.tab === reviewTab);
  state.problems = computeProblems();
  if (reviewTab === 'problems') {
    if (!state.problems.length) body.append(el('div', { class: 'note ok', text: 'No problems found.' }));
    for (const p of state.problems)
      body.append(
        el(
          'div',
          {
            class: 'prob',
            onclick: () => {
              if (p.a) {
                $('#review').close();
                state.nav = { ref: null, path: p.a.folder };
                select(p.a);
              }
            }
          },
          el('span', { class: 'dot ' + p.sev }),
          el('span', { class: 'who', text: p.a ? TYPE[p.a.type].label + ': ' + p.a.name : 'Bundle' }),
          el('span', { text: p.msg })
        )
      );
  } else if (reviewTab === 'output') {
    const files = buildFiles(),
      tree = el('div', { class: 'ftree' });
    let total = 0;
    const dirs = new Set();
    for (const f of files.sort((x, y) => x.path.localeCompare(y.path))) {
      const parts = f.path.split('/');
      total += f.data.length;
      for (let i = 0; i < parts.length - 1; i++) {
        const d = parts.slice(0, i + 1).join('/');
        if (!dirs.has(d)) {
          dirs.add(d);
          tree.append(
            el(
              'div',
              { style: 'padding-left:' + i * 16 + 'px' },
              el('span', { class: 'd', text: parts[i] + '/' })
            )
          );
        }
      }
      tree.append(
        el(
          'div',
          { style: 'padding-left:' + (parts.length - 1) * 16 + 'px' },
          parts[parts.length - 1],
          el('span', { class: 'sz', text: fmtSize(f.data.length) })
        )
      );
    }
    body.append(el('div', { class: 'note', text: files.length + ' files, ' + fmtSize(total) + '' }), tree);
  } else body.append(setCode(el('pre'), json(nlabfObj()), 'json'));
}
function openReview(tab) {
  reviewTab = tab || reviewTab;
  renderReview();
  const d = $('#review');
  if (d.showModal) d.showModal();
  else d.setAttribute('open', '');
}

// ---------- splitters ----------
function bindSplit(el, onMove) {
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    el.classList.add('drag');
  });
  el.addEventListener('pointermove', e => {
    if (el.classList.contains('drag')) {
      onMove(e);
      redraw();
    }
  });
  const end = () => el.classList.remove('drag');
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

// ---------- start ----------
function initUI() {
  const root = document.documentElement.style;
  bindSplit($('#splitR'), e =>
    root.setProperty('--right', Math.max(260, Math.min(680, window.innerWidth - e.clientX - 2)) + 'px')
  );
  bindSplit($('#splitH'), e => {
    const r = $('#left').getBoundingClientRect();
    root.setProperty('--assetsH', Math.max(150, Math.min(r.height - 170, r.bottom - e.clientY)) + 'px');
  });
  bindViewInput();

  $('#bundleName').addEventListener('input', e => {
    state.bundle.name = e.target.value;
    state.dirty = true;
    renderTree();
    renderCrumbs();
    updateBadge();
  });
  $('#btnOpen').addEventListener('click', () => openBundle());
  $('#btnAddRef').addEventListener('click', () => addReference());
  const fi = $('#fileInput');
  fi.accept = Object.values(TYPE)
    .flatMap(t => t.exts)
    .map(x => '.' + x)
    .join(',');
  $('#btnImport').addEventListener('click', () => {
    fi.value = '';
    fi.click();
  });
  fi.addEventListener('change', () => importFiles(fi.files));
  $('#btnExportFolder').addEventListener('click', () => exportFolder());
  $('#btnExportZip').addEventListener('click', () => exportZip());
  $('#btnReview').addEventListener('click', () => openReview());
  $('#btnCloseReview').addEventListener('click', () => $('#review').close());
  for (const t of document.querySelectorAll('#review .tab'))
    t.addEventListener('click', () => {
      reviewTab = t.dataset.tab;
      renderReview();
    });

  const pop = $('#menuNewPop');
  const items = [
    [
      'Folder',
      'folder',
      () => {
        if (state.nav.ref) goto(null, '');
        const n = prompt('Folder name');
        if (n) {
          const p = newFolder(state.nav.path, n);
          if (p) {
            state.open.add(tkey(null, state.nav.path));
            goto(null, p);
            refreshAll();
          }
        }
      }
    ],
    ['Material', 'Material', newMaterial],
    ['Shader', 'Shader', newShader],
    ['Raw shader', 'RawShader', newRawShader],
    ['Scene', 'Scene', newScene],
    ['Component', 'Component', newComponent]
  ];
  for (const [l, ic, fn] of items)
    pop.append(
      el(
        'button',
        {
          onclick: () => {
            pop.classList.remove('open');
            fn();
          }
        },
        icon(ic),
        'New ' + l.toLowerCase()
      )
    );
  // The menu is position:fixed, so the bar's overflow cannot clip it. It opens below its button, or above if there is no room.
  const openNew = anchor => {
    if (pop.classList.contains('open')) {
      pop.classList.remove('open');
      return;
    }
    pop.classList.add('open');
    const r = anchor.getBoundingClientRect(),
      ph = pop.offsetHeight || 220,
      pw = pop.offsetWidth || 200;
    pop.style.left = Math.max(4, Math.min(r.left, window.innerWidth - pw - 4)) + 'px';
    pop.style.top =
      (r.bottom + 4 + ph > window.innerHeight ? Math.max(4, r.top - ph - 4) : r.bottom + 4) + 'px';
  };
  $('#btnNew').addEventListener('click', e => {
    e.stopPropagation();
    openNew($('#btnNew'));
  });
  $('#btnNewAsset').addEventListener('click', e => {
    e.stopPropagation();
    openNew($('#btnNewAsset'));
  });
  document.addEventListener('click', () => pop.classList.remove('open'));

  $('#btnNewFolder').addEventListener('click', () => {
    const n = prompt('Folder name');
    if (n) {
      const p = newFolder(state.nav.path, n);
      if (p) {
        state.open.add(tkey(null, state.nav.path));
        goto(null, p);
        refreshAll();
      }
    }
  });
  $('#btnRenFolder').addEventListener('click', () => {
    const cur = state.nav.path,
      n = prompt('New folder name', cur.slice(cur.lastIndexOf('/') + 1));
    if (n) {
      if (renameFolder(cur, n)) refreshAll();
    }
  });
  $('#btnDelFolder').addEventListener('click', () => {
    if (deleteFolder(state.nav.path)) refreshAll();
  });
  $('#search').addEventListener('input', e => {
    state.filter = e.target.value;
    renderTiles();
  });

  let dragDepth = 0;
  const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', e => {
    if (hasFiles(e)) {
      dragDepth++;
      document.body.classList.add('dragging');
    }
  });
  window.addEventListener('dragleave', e => {
    if (hasFiles(e) && --dragDepth <= 0) {
      dragDepth = 0;
      document.body.classList.remove('dragging');
    }
  });
  window.addEventListener('dragover', e => {
    if (hasFiles(e)) e.preventDefault();
  });
  window.addEventListener('drop', e => {
    dragDepth = 0;
    document.body.classList.remove('dragging');
    if (hasFiles(e)) {
      e.preventDefault();
      importFiles(e.dataTransfer.files);
    }
  });
  window.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (e.key === 'Delete' && state.sel && !state.sel.ref && !['input', 'textarea', 'select'].includes(tag)) {
      if (confirm('Delete "' + state.sel.name + '"?')) {
        deleteAsset(state.sel);
        refreshAll();
      }
    }
    if (e.key === 'Escape') pop.classList.remove('open');
  });
  window.addEventListener('beforeunload', e => {
    if (state.dirty && state.assets.length) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  refreshAll();
  select(null);
}
