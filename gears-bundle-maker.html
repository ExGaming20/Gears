            if (!asset) return;
            const isMat = typeOf(asset).view.kind === 'material';
            const mesh = isMat ? primMesh(viewer.shape) : modelMesh(asset);
            if (!mesh) return;
            const c = viewer.cam,
                cp = Math.cos(c.pitch),
                sp = Math.sin(c.pitch);
            viewer.eye[0] = c.t[0] + c.dist * cp * Math.sin(c.yaw);
            viewer.eye[1] = c.t[1] + c.dist * sp;
            viewer.eye[2] = c.t[2] + c.dist * cp * Math.cos(c.yaw);
            persp(viewer.pj, viewer.FOV, width / height, Math.max(c.radius * 0.01, 1e-3), c.dist + c.radius * 30);
            lookAt(viewer.vw, viewer.eye, c.t);
            mul(viewer.vp, viewer.pj, viewer.vw);
            gl.useProgram(viewer.prog);
            gl.enable(gl.DEPTH_TEST);
            gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
            gl.uniformMatrix4fv(viewer.U.uVP, false, viewer.vp);
            gl.uniformMatrix4fv(viewer.U.uM, false, viewer.ident);
            gl.uniform3f(viewer.U.uCam, viewer.eye[0], viewer.eye[1], viewer.eye[2]);
            viewer.showNormals = !isMat && viewer.shading === 'normals';
            const solid = isMat || viewer.shading !== 'wire',
                wire = !isMat && (viewer.shading === 'wire' || viewer.shading === 'both');
            gl.bindVertexArray(mesh.vao);
            if (solid) {
                gl.uniform1i(viewer.U.uMode, viewer.showNormals ? 2 : 0);
                if (wire) {
                    gl.enable(gl.POLYGON_OFFSET_FILL);
                    gl.polygonOffset(1, 1);
                }
                const items = viewer.items,
                    trans = viewer.trans;
                items.length = 0;
                trans.length = 0;
                if (isMat) items.push({ first: 0, count: mesh.subs[0].count, m: asset.data, d: 0 });
                else
                    for (const s of mesh.subs) {
                        const materialAsset = s.name ? findAsset('Material', s.name) : null,
                            cc = subCenter(mesh, s);
                        items.push({
                            first: s.first,
                            count: s.count,
                            m: materialAsset ? materialAsset.data : null,
                            d: (cc[0] - viewer.eye[0]) ** 2 + (cc[1] - viewer.eye[1]) ** 2 + (cc[2] - viewer.eye[2]) ** 2
                        });
                    }
                for (const it of items) {
                    if (!viewer.showNormals && it.m && it.m.SeeThroughType === 'Transparent') trans.push(it);
                    else drawItem(it);
                }
                trans.sort((p, q) => q.d - p.d);
                for (const it of trans) drawItem(it);
                gl.disable(gl.POLYGON_OFFSET_FILL);
            }
            gl.depthMask(true);
            gl.disable(gl.BLEND);
            gl.disable(gl.CULL_FACE);
            gl.bindSampler(0, null);
            gl.bindSampler(1, null);
            if (wire) {
                ensureLines(mesh);
                if (mesh.lineCount) {
                    gl.uniform1i(viewer.U.uMode, 1);
                    gl.uniform4f(viewer.U.uColor, 0.79, 0.65, 0.36, 1);
                    gl.bindVertexArray(mesh.lineVao);
                    gl.drawArrays(gl.LINES, 0, mesh.lineCount);
                }
            }
            gl.bindVertexArray(null);
        }

        let _checker = null;
        function checkerPattern(ctx) {
            if (_checker) return _checker;
            const c = document.createElement('canvas');
            c.width = c.height = 16;
            const x = c.getContext('2d');
            x.fillStyle = '#2a3036';
            x.fillRect(0, 0, 16, 16);
            x.fillStyle = '#3a424a';
            x.fillRect(0, 0, 8, 8);
            x.fillRect(8, 8, 8, 8);
            return (_checker = ctx.createPattern(c, 'repeat'));
        }
        function channelCanvas(asset, chan) {
            asset._chan = asset._chan || {};
            if (asset._chan[chan]) return asset._chan[chan];
            const w = asset._img.width,
                hgt = asset._img.height,
                c = document.createElement('canvas');
            c.width = w;
            c.height = hgt;
            const x = c.getContext('2d');
            x.drawImage(asset._img, 0, 0);
            const id = x.getImageData(0, 0, w, hgt),
                d = id.data,
                k = { R: 0, G: 1, B: 2, A: 3 }[chan];
            for (let i = 0; i < d.length; i += 4) {
                if (chan === 'RGB') d[i + 3] = 255;
                else {
                    const v = d[i + k];
                    d[i] = d[i + 1] = d[i + 2] = v;
                    d[i + 3] = 255;
                }
            }
            x.putImageData(id, 0, 0);
            return (asset._chan[chan] = c);
        }
        function drawTexture() {
            const asset = state.sel,
                canvas = $('#c2d'),
                box = $('#viewport');
            const dpr = Math.min(window.devicePixelRatio || 1, 2),
                cw = box.clientWidth,
                ch = box.clientHeight;
            if (canvas.width !== Math.floor(cw * dpr) || canvas.height !== Math.floor(ch * dpr)) {
                canvas.width = Math.floor(cw * dpr);
                canvas.height = Math.floor(ch * dpr);
            }
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cw, ch);
            if (!asset || !asset._img) {
                ctx.fillStyle = '#8a95a0';
                ctx.font = '13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(
                    asset && asset._imgFail
                        ? 'The browser cannot decode this image format. The file is still exported.'
                        : 'Decoding image...',
                    cw / 2,
                    ch / 2
                );
                return;
            }
            const iw = asset._img.width,
                ih = asset._img.height,
                tv = viewer.tv;
            if (!tv.fitted) {
                tv.scale = Math.min(8, Math.max(0.02, Math.min((cw - 48) / iw, (ch - 48) / ih)));
                tv.x = tv.y = 0;
                tv.fitted = true;
            }
            const dw = iw * tv.scale,
                dh = ih * tv.scale,
                x0 = cw / 2 + tv.x - dw / 2,
                y0 = ch / 2 + tv.y - dh / 2;
            ctx.save();
            ctx.translate(x0, y0);
            ctx.fillStyle = checkerPattern(ctx);
            ctx.fillRect(0, 0, dw, dh);
            ctx.restore();
            ctx.imageSmoothingEnabled = tv.scale < 1;
            ctx.drawImage(tv.chan === 'RGBA' ? asset._img : channelCanvas(asset, tv.chan), x0, y0, dw, dh);
            ctx.strokeStyle = '#c9a65b';
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 1;
            ctx.strokeRect(x0 - 0.5, y0 - 0.5, dw + 1, dh + 1);
            ctx.globalAlpha = 1;
            $('#viewInfo').textContent =
                iw +
                ' x ' +
                ih +
                '   ' +
                asset.ext +
                '   ' +
                fmtSize(asset.bytes.length) +
                '   zoom ' +
                Math.round(tv.scale * 100) +
                '%';
        }

        function codeView(text, language) {
            const lines = text.split('\n'),
                cut = lines.length > 4000,
                shown = cut ? lines.slice(0, 4000) : lines;
            const code = setCode(
                el('pre'),
                shown.join('\n') + (cut ? '\n... ' + (lines.length - 4000) + ' more lines' : ''),
                language
            );
            return el(
                'div',
                { class: 'code' },
                el('pre', { class: 'ln', text: shown.map((_, i) => i + 1).join('\n') }),
                code
            );
        }
        function sceneTree(j) {
            const root = el('div', { class: 'tree' });
            const walk = (obj, parent) => {
                for (const name of Object.keys(obj)) {
                    const n = obj[name],
                        row = el('div', { class: 'nn' }, icon('Scene'), ' ', name);
                    if (isObj(n) && isObj(n.Components))
                        for (const c of Object.keys(n.Components)) row.append(el('span', { class: 'chip', text: c }));
                    parent.append(row);
                    if (isObj(n) && isObj(n.Children) && Object.keys(n.Children).length) {
                        const box = el('div', { class: 'node' });
                        parent.append(box);
                        walk(n.Children, box);
                    }
                }
            };
            walk(j.Root, root);
            return root;
        }
        function stageBox(label, name, type) {
            if (!name)
                return el(
                    'div',
                    { class: 'stage none' },
                    el('div', { class: 'k', text: label }),
                    el('div', { class: 'v', text: 'not set' })
                );
            const ok = !!findAsset(type, name);
            return el(
                'div',
                { class: 'stage ' + (ok ? 'ok' : 'miss') },
                el('div', { class: 'k', text: label + (ok ? '' : ' - not in bundle') }),
                el('div', { class: 'v', text: name })

        }
        function buildTextView(asset) {
            const container = $('#textView');
            container.textContent = '';
            if (!asset) return;
            const view = typeOf(asset).view;
            if (view.kind === 'code') container.append(codeView(assetText(asset), view.language));
            else if (view.kind === 'dom') view.render(container, asset);
            else if (view.kind === 'model') {
                container.append(
                    el('div', { class: 'note warn', text: 'WebGL2 is not available, so there is no 3D preview.' })
                );
                const parsed = getObj(asset);
                container.append(
                    el('div', { class: 'note', text: parsed.stats.tris + ' triangles, ' + parsed.stats.v + ' vertices.' })
                );
            } else if (view.kind === 'material') {
                container.append(
                    el('div', { class: 'note warn', text: 'WebGL2 is not available, so there is no 3D preview.' }),
                    codeView(assetText(asset), 'json')
                );
            } else container.append(el('div', { class: 'note', text: 'No preview for this type.' }));
        }

        function viewMode(m) {
            viewer.mode = m;
            $('#viewport').className = 'mode-' + m + (viewer.checker ? ' bgchk' : '');
        }
        function buildViewTools() {
            const t = $('#viewTools');
            t.textContent = '';
            const a = state.sel;
            if (!a) return;
            const seg = (items, cur, on) =>
                el(
                    'div',
                    { class: 'seg' },
                    items.map(([v, l]) =>
                        el('button', {
                            class: v === cur ? 'on' : '',
                            text: l,
                            onclick: () => {
                                on(v);
                                buildViewTools();
                            }
                        })

                );
            const kind = typeOf(a).view.kind;
            if (kind === 'image') {
                t.append(
                    seg(
                        ['RGBA', 'RGB', 'R', 'G', 'B', 'A'].map(x => [x, x]),
                        viewer.tv.chan,
                        v => {
                            viewer.tv.chan = v;
                            redraw();
                        }
                    ),
                    el('button', {
                        class: 'btn small',
                        text: 'Fit',
                        onclick: () => {
                            viewer.tv.fitted = false;
                            redraw();
                        }
                    }),
                    el('button', {
                        class: 'btn small',
                        text: '100%',
                        onclick: () => {
                            viewer.tv.scale = 1;
                            viewer.tv.x = viewer.tv.y = 0;
                            viewer.tv.fitted = true;

                        }
                    })
                );
            } else if (kind === 'model') {
                t.append(
                    seg(
                        [
                            ['lit', 'Lit'],

                        ],

                            redraw();
                        }
                    ),
                    seg(

                            ['material', 'Cull: material'],
                            ['back', 'Back'],
                            ['front', 'Front'],
                            ['off', 'None']
                        ],
                        viewer.cull,
                        v => {
                            viewer.cull = v;
                            redraw();
                        }
                    ),
                    checkerBtn(),
                    el('button', {
                        class: 'btn small',
                        text: 'Reset view',
                        onclick: () => {
                            frameView();
                            redraw();
                        }
                    })
                );
            } else if (kind === 'material') {
                t.append(
                    seg(
                        [
                            ['sphere', 'Sphere'],
                            ['cube', 'Cube'],
                            ['plane', 'Plane']
                        ],
                        viewer.shape,
                        v => {
                            viewer.shape = v;
                            frameView();
                            redraw();
                        }
                    ),
                    checkerBtn(),
                    el('button', {
                        class: 'btn small',
                        text: 'Reset view',
                        onclick: () => {
                            frameView();

        function checkerBtn() {
            return el('button', {
                class: 'btn small',
                text: viewer.checker ? 'Plain backdrop' : 'Checker backdrop',
                onclick: () => {
                    viewer.checker = !viewer.checker;
                    $('#viewport').classList.toggle('bgchk', viewer.checker);
                    buildViewTools();
                }
            });
        }
        function frameView() {
            const asset = state.sel;
            if (!asset || !initGL()) return;
            const kind = typeOf(asset).view.kind;
            const mesh = kind === 'material' ? primMesh(viewer.shape) : kind === 'model' ? modelMesh(asset) : null;
            if (mesh) {
                frameCamera(mesh.radius, mesh.center);
                viewer.cam.yaw = 0.7;
                viewer.cam.pitch = 0.28;
            }
        }
        function showAsset() {
            const asset = state.sel;
            const title = $('#viewTitle');
            title.textContent = '';
            if (!asset) {
                title.textContent = 'No asset selected';
                viewMode('empty');
                buildViewTools();
                return;
            }
            const type = typeOf(asset);
            const kind = type.view.kind;
            title.append(asset.name, el('small', { text: type.label + (asset.ref ? '  -  reference' : '') }));
            viewer.tv.fitted = false;
            viewer.tv.chan = 'RGBA';
            $('#viewInfo').textContent = '';
            if (kind === 'material') viewer.cull = 'material';

            if (kind === 'image') {
                viewMode('2d');
                ensureImage(asset);
            } else if ((kind === 'model' || kind === 'material') && initGL()) {
                viewMode('gl');
                const decodeTexturesOf = material => {
                    for (const slot of material.data.Textures) {
                        const textureAsset = findAsset('Texture', slot.TextureName);
                        if (textureAsset) ensureImage(textureAsset);
                    }
                };
                if (kind === 'material') decodeTexturesOf(asset);
                else {
                    for (const name of getObj(asset).mats) {
                        const materialAsset = findAsset('Material', name);
                        if (materialAsset) decodeTexturesOf(materialAsset);
                    }
                }
                frameView();
                if (kind === 'model') {
                    const parsed = getObj(asset);
                    $('#viewInfo').textContent =
                        parsed.stats.tris +
                        ' triangles  ' +
                        parsed.stats.v +
                        ' vertices  ' +
                        parsed.subs.length +
                        ' sub-mesh(es)';
                }
            } else {
                buildTextView(asset);
                viewMode('text');
            }
            buildViewTools();
            redraw();
        }
        function renderView() {
            if (viewer.mode === 'gl' && viewer.gl) drawGL();
            else if (viewer.mode === '2d') drawTexture();
        }
        function redraw() {
            if (viewer.raf) return;
            viewer.raf = requestAnimationFrame(() => {
                viewer.raf = 0;
                renderView();
            });
        }

        function bindViewInput() {
            for (const canvas of [$('#gl'), $('#c2d')]) {
                canvas.addEventListener('pointerdown', e => {
                    canvas.setPointerCapture(e.pointerId);
                    viewer.drag = { x: e.clientX, y: e.clientY, btn: e.button, shift: e.shiftKey };
                });
                canvas.addEventListener('pointerup', () => {
                    viewer.drag = null;
                });
                canvas.addEventListener('pointercancel', () => {
                    viewer.drag = null;
                });
                canvas.addEventListener('contextmenu', e => e.preventDefault());
                canvas.addEventListener('pointermove', e => {
                    const d = viewer.drag;
                    if (!d) return;
                    const dx = e.clientX - d.x,
                        dy = e.clientY - d.y;
                    d.x = e.clientX;
                    d.y = e.clientY;
                    if (canvas.id === 'c2d') {
                        viewer.tv.x += dx;
                        viewer.tv.y += dy;
                        redraw();
                        return;
                    }
                    const c = viewer.cam;
                    if (d.btn === 1 || d.btn === 2 || d.shift) {
                        const k = c.dist * 0.0016,
                            sy = Math.sin(c.yaw),
                            cy = Math.cos(c.yaw),
                            sp = Math.sin(c.pitch),
                            cp = Math.cos(c.pitch);
                        c.t[0] += -dx * k * cy + dy * k * (-sp * sy);
                        c.t[1] += dy * k * cp;
                        c.t[2] += dx * k * sy + dy * k * (-sp * cy);
                    } else {
                        c.yaw -= dx * 0.008;
                        c.pitch = Math.max(-1.5, Math.min(1.5, c.pitch + dy * 0.008));
                    }
                    redraw();
                });
                canvas.addEventListener(
                    'wheel',
                    e => {
                        e.preventDefault();
                        if (canvas.id === 'c2d') {
                            viewer.tv.scale = Math.max(0.02, Math.min(64, viewer.tv.scale * Math.exp(-e.deltaY * 0.0016)));
                            viewer.tv.fitted = true;
                        } else
                            viewer.cam.dist = Math.max(
                                viewer.cam.radius * 0.15,
                                Math.min(viewer.cam.radius * 14, viewer.cam.dist * Math.exp(e.deltaY * 0.0016))
                            );
                        redraw();
                    },
                    { passive: false }
                );
                canvas.addEventListener('dblclick', () => {
                    if (canvas.id === 'c2d') viewer.tv.fitted = false;
                    else frameView();
                    redraw();
                });
            }
            if (window.ResizeObserver) new ResizeObserver(() => redraw()).observe($('#viewport'));
        }

        let uiQueued = false;

        function problemsFor(asset) {

        function worst(asset) {

        function updateBadge() {

        const tkey = (ref, path) => '@' + (ref || '') + (path ? ':' + path : '');
        function navIs(ref, path) {
            return (state.nav.ref || null) === (ref || null) && state.nav.path === path;
        }
        function goto(ref, path) {
            state.nav = { ref: ref || null, path };
            state.filter = '';
            $('#search').value = '';
            renderTree();
            renderTiles();
            renderCrumbs();
        }

        function treeRow(label, ico, depth, key, hasKids, sel, onclick, stub) {
            const open = state.open.has(key);
            const r = el(
                'div',
                {
                    class: 'trow' + (sel ? ' sel' : '') + (stub ? ' stub' : ''),
                    style: 'padding-left:' + (8 + depth * 14) + 'px',
                    role: 'treeitem',
                    onclick
                },
                el(
                    'span',
                    {
                        class: 'chev ' + (hasKids ? (open ? '' : 'closed') : 'none'),
                        onclick: e => {
                            e.stopPropagation();
                            if (open) state.open.delete(key);
                            else state.open.add(key);
                            renderTree();
                        }
                    },
                    icon('chev', '')
                ),
                icon(ico),
                el('span', { class: 'nm', text: label, title: label })
            );
            r.querySelector('.chev svg').style.cssText = 'width:10px;height:10px';
            return r;
        }
        function addDrop(row, path) {
            row.addEventListener('dragover', e => {
                if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('application/x-gbm-asset')) {
                    e.preventDefault();
                    row.classList.add('drop');
                }
            });
            row.addEventListener('dragleave', () => row.classList.remove('drop'));
            row.addEventListener('drop', e => {
                row.classList.remove('drop');
                const id = e.dataTransfer.getData('application/x-gbm-asset');
                if (!id) return;
                e.preventDefault();
                e.stopPropagation();
                const a = state.assets.find(x => x.id === id);
                if (a) {
                    moveAsset(a, path);
                    refreshAll();
                }
            });
        }
        function subtree(out, ref, folderSet, path, depth) {
            const kids = Array.from(folderSet)
                .filter(p => parentPath(p) === path)
                .sort((a, b) => a.localeCompare(b));
            for (const p of kids) {
                const key = tkey(ref, p),
                    hasKids = Array.from(folderSet).some(q => parentPath(q) === p);
                const row = treeRow(p.slice(p.lastIndexOf('/') + 1), 'folder', depth, key, hasKids, navIs(ref, p), () =>
                    goto(ref, p)
                );
                if (!ref) addDrop(row, p);
                out.append(row);
                if (state.open.has(key)) subtree(out, ref, folderSet, p, depth + 1);
            }
        }
        function renderTree() {
            const t = $('#tree');
            t.textContent = '';
            const rk = tkey(null, ''),
                has = allFolders().size > 0;
            const root = treeRow(state.bundle.name || 'Bundle', 'bundle', 0, rk, has, navIs(null, ''), () =>
                goto(null, '')
            );
            addDrop(root, '');
            t.append(root);
            if (state.open.has(rk)) subtree(t, null, allFolders(), '', 1);
            if (state.refs.length || state.bundle.refList.length) {
                t.append(el('div', { class: 'tsec', text: 'Reference bundles' }));
                for (const l of state.bundle.refList) {
                    const r = state.refs.find(x => x.uuid === l.uuid),
                        key = tkey(l.uuid, '');
                    if (!r) {
                        t.append(
                            treeRow(
                                (l.name || 'Unnamed') + ' (not loaded)',
                                'lock',
                                0,
                                key,
                                false,
                                false,
                                () => addReference(),
                                true
                            )
                        );
                        continue;
                    }
                    const fs = refFolders(r);
                    t.append(treeRow(r.name, 'lock', 0, key, fs.size > 0, navIs(r.uuid, ''), () => goto(r.uuid, '')));
                    if (state.open.has(key)) subtree(t, r.uuid, fs, '', 1);
                }
            }
        }

        function renderCrumbs() {
            const c = $('#crumbs');

        function materialThumb(material) {
            const size = 68,
                canvas = el('canvas', { width: size, height: size });
            const base = material.data.BaseColor;
            const paint = image => {
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                ctx.clearRect(0, 0, size, size);
                ctx.save();
                ctx.beginPath();
                ctx.arc(size / 2, size / 2, 30, 0, Math.PI * 2);
                ctx.clip();
                if (image) {
                    const scale = Math.max(60 / image.width, 60 / image.height);
                    ctx.drawImage(
                        image,
                        (size - image.width * scale) / 2,
                        (size - image.height * scale) / 2,
                        image.width * scale,
                        image.height * scale
                    );
                    ctx.globalCompositeOperation = 'multiply';
                }
                ctx.fillStyle = toHex(base);
                ctx.fillRect(0, 0, size, size);
                ctx.globalCompositeOperation = 'source-over';
                const light = ctx.createRadialGradient(24, 22, 3, 34, 34, 34);
                light.addColorStop(0, 'rgba(255,255,255,0.40)');
                light.addColorStop(0.45, 'rgba(255,255,255,0)');
                light.addColorStop(1, 'rgba(0,0,0,0.45)');
                ctx.fillStyle = light;
                ctx.fillRect(0, 0, size, size);
                ctx.restore();
            };
            const texture = primaryTexture(material);
            paint(texture && texture._img ? texture._img : null);
            if (texture && !texture._img)
                ensureImage(texture).then(image => {
                    if (image) paint(image);
                });
            return canvas;
        }

                const ctx = canvas.getContext('2d');
                if (!image || !ctx) return;
                const scale = Math.min(68 / image.width, 68 / image.height);
                ctx.clearRect(0, 0, 68, 68);
                ctx.drawImage(
                    image,
                    (68 - image.width * scale) / 2,
                    (68 - image.height * scale) / 2,
                    image.width * scale,
                    image.height * scale
                );
            };
            if (asset._img) draw(asset._img);

            return canvas;

        function renderLayout(panel, asset, layout, readOnly) {
            for (const group of layout) {
                if (group.show && !group.show(asset)) continue;
                const section = secEl(group.title);
                for (const field of group.fields) {
                    if (field.show && !field.show(asset)) continue;
                    const control = fieldControl(asset, field, readOnly);
                    const stacked = field.kind === 'code' || field.kind === 'button';
                    section.append(stacked ? el('div', { class: 'row stack' }, control) : row(field.label, control));
                }
                panel.append(section);

        function fieldControl(asset, field, readOnly) {
            const isJson = typeOf(asset).format === 'json';
            const textCode = field.kind === 'code' && !field.key && !field.get;
            const read = () => {
                if (textCode) return asset.text || '';
                if (field.get) return field.get(asset);
                if (!field.key) return undefined;
                return isJson ? getPath(asset.data, field.key) : getSetting(asset, field.key);
            };
            const write = value => {
                if (textCode) asset.text = value;
                else if (field.set) field.set(asset, value);
                else if (field.key) {
                    if (isJson) setPath(asset.data, field.key, value);
                    else setSetting(asset, field.key, value);
                }
                touch(asset);
                if (field.rebuild) renderInspector();
            };
            const options = (field.options || []).map(option =>
                Array.isArray(option) ? option : [option, String(option)]
            );

            let control;
            switch (field.kind) {
                case 'number':
                    control = inNum(read, write, { min: field.min, max: field.max, step: field.step });
                    break;
                case 'range':
                    control = inRange(read, write, field.min ?? 0, field.max ?? 1, field.step ?? 0.01);
                    break;
                case 'check':
                    control = inCheck(read, write);
                    break;
                case 'select':
                    control = inSelect(read, write, options);
                    break;
                case 'color':
                    control = el('input', {
                        type: 'color',
                        value: read() || '#ffffff',
                        oninput: e => write(e.target.value)
                    });
                    break;
                case 'vec2':
                case 'vec3':
                case 'vec4':
                    control = vectorControl(read, write, Number(field.kind[3]));
                    break;
                case 'info':
                    control = el('span', { class: 'ro', text: String(field.value ? field.value(asset) : (read() ?? '')) });
                    break;
                case 'code':
                    control = codeEditor(read() ?? '', field.language || '', write);
                    break;
                case 'button':
                    control = el('button', {
                        class: 'btn small',
                        text: field.label,
                        onclick: () => {
                            field.onClick(asset);
                            touch(asset);
                            renderInspector();
                        }
                    });
                    break;
                default:
                    control = inText(read, write, { ph: field.placeholder, list: field.list });
            }
            if (readOnly) disableControls(control);
            return control;
        }

        function vectorControl(read, write, size) {
            const current = () => (Array.isArray(read()) ? read().slice() : new Array(size).fill(0));
            const box = el('div', { class: 'pair' });
            for (let i = 0; i < size; i++) {
                box.append(
                    el('input', {
                        type: 'number',
                        step: 0.1,
                        value: r6(current()[i] || 0),
                        oninput: e => {
                            const number = parseFloat(e.target.value);
                            if (!Number.isFinite(number)) return;
                            const vector = current();
                            vector[i] = number;
                            write(vector);
                        }
                    })
                );
            }
            return box;
        }

            const all = control.matches && control.matches('input,select,textarea,button') ? [control] : [];
            all.push(...control.querySelectorAll('input,select,textarea,button'));
            for (const element of all) element.disabled = true;
        }

        function renderReview() {
            const body = $('#reviewBody');
            body.textContent = '';
            for (const t of document.querySelectorAll('#review .tab'))
                t.classList.toggle('on', t.dataset.tab === reviewTab);
            state.problems = computeProblems();
            if (reviewTab === 'problems') {
                if (!state.problems.length) body.append(el('div', { class: 'note ok', text: 'No problems found.' }));
                for (const p of state.problems)
                    body.append(
                        el(
                            'div',
                            {
                                class: 'prob',
                                onclick: () => {
                                    if (p.a) {
                                        $('#review').close();
                                        state.nav = { ref: null, path: p.a.folder };
                                        select(p.a);
                                    }
                                }
                            },
                            el('span', { class: 'dot ' + p.sev }),
                            el('span', { class: 'who', text: p.a ? typeOf(p.a).label + ': ' + p.a.name : 'Bundle' }),
                            el('span', { text: p.msg })
                        )
                    );
            } else if (reviewTab === 'output') {
                const files = buildFiles(),
                    tree = el('div', { class: 'ftree' });
                let total = 0;
                const dirs = new Set();
                for (const f of files.sort((x, y) => x.path.localeCompare(y.path))) {
                    const parts = f.path.split('/');
                    total += f.data.length;
                    for (let i = 0; i < parts.length - 1; i++) {
                        const d = parts.slice(0, i + 1).join('/');
                        if (!dirs.has(d)) {
                            dirs.add(d);
                            tree.append(
                                el(
                                    'div',
                                    { style: 'padding-left:' + i * 16 + 'px' },
                                    el('span', { class: 'd', text: parts[i] + '/' })
                                )
                            );
                        }
                    }
                    tree.append(
                        el(
                            'div',
                            { style: 'padding-left:' + (parts.length - 1) * 16 + 'px' },
                            parts[parts.length - 1],
                            el('span', { class: 'sz', text: fmtSize(f.data.length) })
                        )
                    );
                }
                body.append(el('div', { class: 'note', text: files.length + ' files, ' + fmtSize(total) + '' }), tree);
            } else body.append(setCode(el('pre'), json(nlabfObj()), 'json'));
        }

        function bindSplit(el, onMove) {
            el.addEventListener('pointerdown', e => {
                el.setPointerCapture(e.pointerId);
                el.classList.add('drag');
            });
            el.addEventListener('pointermove', e => {
                if (el.classList.contains('drag')) {
                    onMove(e);
                    redraw();
                }
            });
            const end = () => el.classList.remove('drag');
            el.addEventListener('pointerup', end);
            el.addEventListener('pointercancel', end);
        }

        function initUI() {
            const root = document.documentElement.style;
            bindSplit($('#splitR'), e =>
                root.setProperty('--right', Math.max(260, Math.min(680, window.innerWidth - e.clientX - 2)) + 'px')
            );
            bindSplit($('#splitH'), e => {
                const r = $('#left').getBoundingClientRect();
                root.setProperty('--assetsH', Math.max(150, Math.min(r.height - 170, r.bottom - e.clientY)) + 'px');
            });
            bindViewInput();

            $('#bundleName').addEventListener('input', e => {
                state.bundle.name = e.target.value;
                state.dirty = true;
                renderTree();
                renderCrumbs();
                updateBadge();
            });
            $('#btnOpen').addEventListener('click', () => openBundle());
            $('#btnAddRef').addEventListener('click', () => addReference());
            $('#btnAddDefaultRef').addEventListener('click', () => addDefaultReferenceBundle());
            const fi = $('#fileInput');
            fi.accept = typeList()
                .flatMap(type => type.extensions)
                .map(extension => '.' + extension)
                .join(',');
            $('#btnImport').addEventListener('click', () => {
                fi.value = '';
                fi.click();
            });
            fi.addEventListener('change', () => importFiles(fi.files));
            $('#btnExportFolder').addEventListener('click', () => exportFolder());
            $('#btnExportZip').addEventListener('click', () => exportZip());
            $('#btnReview').addEventListener('click', () => openReview());
            $('#btnCloseReview').addEventListener('click', () => $('#review').close());
            for (const t of document.querySelectorAll('#review .tab'))
                t.addEventListener('click', () => {
                    reviewTab = t.dataset.tab;
                    renderReview();
                });

            const pop = $('#menuNewPop');
            const items = [
                [
                    'Folder',
                    'folder',
                    () => {
                        if (state.nav.ref) goto(null, '');
                        const n = prompt('Folder name');
                        if (n) {
                            const p = newFolder(state.nav.path, n);
                            if (p) {
                                state.open.add(tkey(null, state.nav.path));
                                goto(null, p);
                                refreshAll();
                            }
                        }
                    }
                ],
                ...typeList()
                    .filter(isCreatable)
                    .map(type => [
                        type.newLabel || type.label,
                        type.icon ? type.id : 'file',
                        () => {
                            const asset = createAsset(type.id);
                            select(asset);
                            refreshAll();
                        }
                    ])
            ];
            for (const [l, ic, fn] of items)
                pop.append(
                    el(
                        'button',
                        {
                            onclick: () => {
                                pop.classList.remove('open');
                                fn();
                            }
                        },
                        icon(ic),
                        'New ' + l.toLowerCase()
                    )
                );
            const openNew = anchor => {
                if (pop.classList.contains('open')) {
                    pop.classList.remove('open');
                    return;
                }
                pop.classList.add('open');
                const r = anchor.getBoundingClientRect(),
                    ph = pop.offsetHeight || 220,
                    pw = pop.offsetWidth || 200;
                pop.style.left = Math.max(4, Math.min(r.left, window.innerWidth - pw - 4)) + 'px';
                pop.style.top =
                    (r.bottom + 4 + ph > window.innerHeight ? Math.max(4, r.top - ph - 4) : r.bottom + 4) + 'px';
            };
            $('#btnNew').addEventListener('click', e => {
                e.stopPropagation();
                openNew($('#btnNew'));
            });
            $('#btnNewAsset').addEventListener('click', e => {
                e.stopPropagation();
                openNew($('#btnNewAsset'));
            });
            document.addEventListener('click', () => pop.classList.remove('open'));

            $('#btnNewFolder').addEventListener('click', () => {
                const n = prompt('Folder name');
                if (n) {
                    const p = newFolder(state.nav.path, n);
                    if (p) {
                        state.open.add(tkey(null, state.nav.path));
                        goto(null, p);
                        refreshAll();
                    }
                }
            });
            $('#btnRenFolder').addEventListener('click', () => {
                const cur = state.nav.path,
                    n = prompt('New folder name', cur.slice(cur.lastIndexOf('/') + 1));
                if (n) {
                    if (renameFolder(cur, n)) refreshAll();
                }
            });
            $('#btnDelFolder').addEventListener('click', () => {
                if (deleteFolder(state.nav.path)) refreshAll();
            });
            $('#search').addEventListener('input', e => {
                state.filter = e.target.value;
                renderTiles();
            });

            let dragDepth = 0;
            const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
            window.addEventListener('dragenter', e => {
                if (hasFiles(e)) {
                    dragDepth++;
                    document.body.classList.add('dragging');
                }
            });
            window.addEventListener('dragleave', e => {
                if (hasFiles(e) && --dragDepth <= 0) {
                    dragDepth = 0;
                    document.body.classList.remove('dragging');
                }
            });
            window.addEventListener('dragover', e => {
                if (hasFiles(e)) e.preventDefault();
            });
            window.addEventListener('drop', e => {
                dragDepth = 0;
                document.body.classList.remove('dragging');
                if (hasFiles(e)) {
                    e.preventDefault();
                    importFiles(e.dataTransfer.files);
                }
            });
            window.addEventListener('keydown', e => {
                const tag = (e.target.tagName || '').toLowerCase();
                if (e.key === 'Delete' && state.sel && !state.sel.ref && !['input', 'textarea', 'select'].includes(tag)) {
                    if (confirm('Delete "' + state.sel.name + '"?')) {
                        deleteAsset(state.sel);
                        refreshAll();
                    }
                }
                if (e.key === 'Escape') pop.classList.remove('open');
            });
            window.addEventListener('beforeunload', e => {
                if (state.dirty && state.assets.length) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });

            refreshAll();
            select(null);
        }

        registerAssetType({
            id: 'Texture',
            label: 'Texture',
            folder: 'Textures',
            icon:
                '<rect x="2" y="2" width="12" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>' +
                '<rect x="2.7" y="2.7" width="5.3" height="5.3" fill="currentColor"/><rect x="8" y="8" width="5.3" height="5.3" fill="currentColor"/>',
            extensions: ['png', 'jpg', 'jpeg', 'bmp', 'tga', 'gif'],
            format: 'binary',
            view: { kind: 'image' },
            thumbnail: textureThumb,
            inspector: textureSection,
            referenceInspector: textureSection,
            extraPresets: [
                { k: 'channels', kind: 'enum', opts: ['rgba', 'rgb', 'rg', 'r', 'g', 'b', 'a'], v: 'rgba' },
                { k: 'hdr', kind: 'bool', v: false },
                { k: 'srgb', kind: 'bool', v: true },
                { k: 'alphaMode', kind: 'enum', opts: ['none', 'straight', 'premultiplied'], v: 'straight' },
                { k: 'usage', kind: 'enum', opts: ['color', 'normal', 'data', 'mask', 'ui', 'cubemap'], v: 'color' },
                { k: 'mipmaps', kind: 'bool', v: true },
                { k: 'compression', kind: 'enum', opts: ['none', 'bc1', 'bc3', 'bc5', 'bc7'], v: 'none' },
                { k: 'maxSize', kind: 'enum', opts: [0, 256, 512, 1024, 2048, 4096, 8192], v: 0 },
                { k: 'flipY', kind: 'bool', v: false }
            ],
            onRename(asset, oldName, newName) {
                for (const material of state.assets.filter(x => x.type === 'Material')) {
                    for (const slot of material.data.Textures) if (slot.TextureName === oldName) slot.TextureName = newName;
                }
            },
            problems(asset, report) {
                if (!asset.bytes || !asset.bytes.length) report('err', 'The image file is empty.');
                else if (asset._imgFail) report('warn', 'No preview: the browser cannot decode this image.');
            }
        });

        registerAssetType({
            id: 'Model',
            label: 'Model',
            folder: 'Models',
            icon: lineIcon('M8 1.8 14 5v6l-6 3.2L2 11V5z M2 5l6 3.2L14 5 M8 8.2v6'),
            extensions: ['obj'],
            format: 'text',
            view: { kind: 'model' },
            inspector: modelSection,
            referenceInspector(panel, asset) {
                const parsed = getObj(asset);
                const section = secEl('Mesh');
                section.append(
                    row('Triangles', el('span', { class: 'ro', text: String(parsed.stats.tris) })),
                    row('Materials', el('span', { class: 'ro', text: parsed.mats.join(', ') || 'none' }))
                );
                panel.append(section);
            },
            extraPresets: [
                { k: 'unitScale', kind: 'number', v: 1 },
                { k: 'upAxis', kind: 'enum', opts: ['Y', 'Z'], v: 'Y' },
                { k: 'flipUV', kind: 'bool', v: false },
                { k: 'smoothNormals', kind: 'bool', v: true }
            ],
            problems(asset, report) {
                const parsed = getObj(asset);
                if (!parsed.stats.tris) report('err', 'No faces found in this OBJ file.');
                for (const name of parsed.mats) {
                    if (!findAsset('Material', name))
                        report('warn', 'Material "' + name + '" (usemtl) not found in this bundle or its references.');
                }
            }
        });

        registerAssetType({
            id: 'Material',
            label: 'Material',
            folder: 'Materials',
            icon:
                '<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/>' +
                '<path d="M4.6 6.4a3.9 3.9 0 0 1 2.8-1.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
            extensions: ['nlmf'],
            format: 'json',
            create: () => defMat(''),
            read: parseMat,
            write: matToJson,
            onCreate(asset) {
                const shader = state.assets.find(x => x.type === 'Shader');
                if (shader) asset.data.ShaderName = shader.name;
            },
            view: { kind: 'material' },
            thumbnail: materialThumb,
            inspector: materialSections,
            referenceInspector(panel, asset) {
                const material = asset.data;
                const section = secEl('Surface');
                section.append(
                    row('Shader', el('span', { class: 'ro', text: material.ShaderName })),
                    row('Metallic', el('span', { class: 'ro', text: String(r6(material.Metallic)) })),
                    row('Roughness', el('span', { class: 'ro', text: String(r6(material.Roughness)) }))
                );
                for (const slot of material.Textures)
                    section.append(
                        row(slot.SemanticName || 'texture', el('span', { class: 'ro', text: slot.TextureName }))
                    );
                panel.append(section);
            },
            problems(asset, report) {
                const material = asset.data;
                if (!material.ShaderName) report('warn', 'No shader is set.');
                else if (!findAsset('Shader', material.ShaderName))
                    report('warn', 'Shader "' + material.ShaderName + '" not found in this bundle or its references.');
                material.Textures.forEach((slot, index) => {
                    if (!slot.TextureName) report('warn', 'Texture slot ' + (index + 1) + ' has no texture.');
                    else if (!findAsset('Texture', slot.TextureName))
                        report('warn', 'Texture "' + slot.TextureName + '" not found in this bundle or its references.');
                });
            }
        });

        registerAssetType({
            id: 'Shader',
            label: 'Shader',
            folder: 'Shaders',
            icon:
                '<path d="M7 2.2 8.5 6.5 12.8 8 8.5 9.5 7 13.8 5.5 9.5 1.2 8 5.5 6.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>' +
                '<path d="M12.4 1.6v3M10.9 3.1h3M12.6 11v3M11.1 12.5h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
            extensions: ['nlsf'],
            format: 'json',
            syncMeta: syncShaderUniforms,
            create: defShader,
            read: parseShader,
            write: shToJson,
            onCreate(asset) {
                const rawShaders = state.assets.filter(x => x.type === 'RawShader');
                if (rawShaders[0]) asset.data.Vertex = rawShaders[0].name;
                if (rawShaders[1]) asset.data.Fragment = rawShaders[1].name;
            },
            onRename(asset, oldName, newName) {
                for (const material of state.assets.filter(x => x.type === 'Material')) {
                    if (material.data.ShaderName === oldName) material.data.ShaderName = newName;
                }
            },
            view: {
                kind: 'dom',
                render(container, asset) {
                    const shader = asset.data;
                    const pipeline = el('div', { class: 'pipe' });
                    if (shader.Drawable) {
                        pipeline.append(stageBox('Vertex', shader.Vertex, 'RawShader'), el('div', { class: 'wire' }));
                        if (shader.Geometry)
                            pipeline.append(stageBox('Geometry', shader.Geometry, 'RawShader'), el('div', { class: 'wire' }));
                        pipeline.append(stageBox('Fragment', shader.Fragment, 'RawShader'));
                    } else pipeline.append(stageBox('Compute', shader.Compute, 'RawShader'));
                    container.append(pipeline, el('div', { style: 'height:18px' }), codeView(shToJson(asset), 'json'));
                }
            },
            inspector: shaderSection,
            referenceInspector(panel, asset) {
                const section = secEl('Stages');
                for (const stage of ['Vertex', 'Geometry', 'Fragment', 'Compute']) {
                    if (asset.data[stage]) section.append(row(stage, el('span', { class: 'ro', text: asset.data[stage] })));
                }
                panel.append(section);
            },
            problems(asset, report) {
                const shader = asset.data;
                const stages = shader.Drawable ? ['Vertex', 'Geometry', 'Fragment'] : ['Compute'];
                if (shader.Drawable) {
                    if (!shader.Vertex) report('err', 'A drawable shader needs a vertex stage.');
                    if (!shader.Fragment) report('err', 'A drawable shader needs a fragment stage.');
                } else if (!shader.Compute) report('err', 'A compute shader needs a compute stage.');
                for (const stage of stages) {
                    if (shader[stage] && !findAsset('RawShader', shader[stage]))
                        report('warn', stage + ' source "' + shader[stage] + '" not found in this bundle or its references.');
                }
                if (shader.Drawable) checkShaderInterface(shader, report);
            },
            okNote(asset) {
                if (!asset.data.Drawable) return '';
                return checkShaderInterface(asset.data, () => {}) === 0 ? 'Stage inputs, outputs and uniforms match.' : '';
            }
        });

        registerAssetType({
            id: 'RawShader',
            label: 'Raw shader',
            plural: 'Raw Shaders',
            folder: 'Raw Shaders',
            icon: lineIcon('M5.5 4 2 8l3.5 4M10.5 4 14 8l-3.5 4'),
            extensions: ['shader', 'glsl', 'vert', 'frag', 'geom', 'comp'],
            fixedExtension: 'shader',
            format: 'text',
            syncMeta: syncShaderMeta,
            starter: () => '// Raw shader source\n',
            onRename(asset, oldName, newName) {
                for (const shader of state.assets.filter(x => x.type === 'Shader')) {
                    for (const stage of ['Vertex', 'Fragment', 'Geometry', 'Compute'])
                        if (shader.data[stage] === oldName) shader.data[stage] = newName;
                }
            },
            view: { kind: 'code', language: 'glsl' },
            problems(asset, report) {
                if (!(asset.text || '').trim()) report('warn', 'The shader source is empty.');
            }
        });

        registerAssetType({
            id: 'Scene',
            jsonText: true,
            label: 'Scene',
            folder: 'Scenes',
            icon:
                '<circle cx="8" cy="3.6" r="1.8" fill="currentColor"/><circle cx="4" cy="12" r="1.8" fill="currentColor"/>' +
                '<circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M8 5.4 4 10.2M8 5.4l4 4.8" stroke="currentColor" stroke-width="1.3" fill="none"/>',
            extensions: ['json'],
            format: 'text',
            starter: () => json({ Name: 'New scene', Root: {} }),
            editorTitle: 'Scene JSON',
            editorLanguage: 'json',
            view: {
                kind: 'dom',
                render(container, asset) {
                    let parsed = null;
                    try {
                        parsed = JSON.parse(asset.text || '');
                    } catch (error) {
                        container.append(el('div', { class: 'note err', text: 'Invalid JSON: ' + error.message }));
                    }
                    if (parsed && isObj(parsed.Root)) container.append(sceneTree(parsed));
                    else if (parsed)
                        container.append(el('div', { class: 'note warn', text: 'No "Root" object in this scene.' }));
                    container.append(el('div', { style: 'height:18px' }), codeView(asset.text || '', 'json'));
                }
            },
            problems(asset, report) {
                try {
                    const parsed = JSON.parse(asset.text || '');
                    if (!isObj(parsed) || !isObj(parsed.Root)) report('warn', 'The scene has no "Root" object.');
                } catch (error) {
                    report('err', 'Invalid JSON: ' + error.message);
                }
            }
        });

        registerAssetType({
            id: 'Component',
            label: 'Component',
            folder: 'Components',
            icon: '<path d="M9.6 2 6.4 14M4 5.6 1.6 8 4 10.4M12 5.6 14.4 8 12 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /',
            extensions: ['cs'],
            format: 'text',
            starter: asset => componentStub(asset.name),
            editorTitle: 'Script',
            editorLanguage: 'cs',
            onRename(asset, oldName, newName) {
                if (typeof asset.text === 'string')
                    asset.text = asset.text.replace(
                        new RegExp('\\bclass\\s+' + identOf(oldName) + '\\b'),
                        'class ' + identOf(newName)
                    );
            },
            view: { kind: 'code', language: 'cs' },
            problems(asset, report) {
                if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(asset.name))
                    report('warn', 'The name must be a valid C# class name.');
                if (!(asset.text || '').trim()) report('warn', 'The script is empty.');
                else if (!new RegExp('\\bclass\\s+' + identOf(asset.name) + '\\b').test(asset.text))
                    report('warn', 'The script has no class named "' + identOf(asset.name) + '".');
            }
        });

        window.GBM = {
            tokenize,
            codeEditor,
            bindMaterial,
            applyPixelFormat,
            rewriteUsemtl,
            setModelMaterial,
            emissionToFile,
            emissionFromFile,
            primaryTexture,
            samplerFor,
            genSphere,
            genCube,
            genPlane,
            cullOf,
            samplerPresetOf,
            applySampler,
            SAMPLER_PRESETS,
            changeAssetType,
            componentStub,
            identOf,
            inspTarget,
            S: state,
            V: viewer,
            assetTypes,
            typeOf,
            typeList,
            registerAssetType,
            createAsset,
            renderLayout,
            newAsset,
            addAsset,
            importFile,
            importFiles,
            buildFiles,
            makeZipBytes,
            crc32,
            parseOBJ,
            parseMat,
            matToJson,
            parseShader,
            shToJson,
            nlamObj,
            nlabfObj,
            computeProblems,
            parseBundle,
            addParsedReference,
            addDefaultReferenceBundle,
            renameAsset,
            cloneAsset,
            defMat,
            defSlot,
            defShader,
            select,
            refreshAll
        };
        initUI();
    </script>
</body>
</html>
