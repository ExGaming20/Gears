<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gears bundle maker</title>
    <style>
        :root {
            --bg: #13161a;
            --panel: #1a1e23;
            --raised: #232930;
            --sunk: #101316;
            --line: #303840;
            --line-soft: #272d34;
            --text: #d9dee3;
            --muted: #8a95a0;
            --faint: #5d6873;
            --brass: #c9a65b;
            --brass-dim: #8f7539;
            --brass-wash: rgba(201, 166, 91, 0.15);
            --ok: #6fb7a3;
            --warn: #d9a441;
            --err: #e0716a;
            --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
            color-scheme: dark;
            --right: clamp(300px, 30vw, 460px);
            --assetsH: 36vh;
            --tree: 190px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.45 var(--ui);
            overflow: hidden;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--brass);
            outline-offset: 1px;
        }

        ::selection {
            background: var(--brass-dim);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d353d;
            border: 2px solid var(--panel);
            border-radius: 6px;
        }

            ::-webkit-scrollbar-thumb:hover {
                background: #3a444e;
            }

        svg.i {
            width: 15px;
            height: 15px;
            flex: none;
        }

        /* ---- layout: bar on top, left column (viewer over assets), settings on the right ---- */
        #app {
            display: grid;
            height: 100vh;
            grid-template-columns: minmax(0, 1fr) 5px var(--right);
            grid-template-rows: 46px minmax(0, 1fr);
        }

        #bar {
            grid-column: 1/-1;
            grid-row: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            min-width: 0;
            overflow-x: auto;
        }

        #left {
            grid-column: 1;
            grid-row: 2;
            display: grid;
            grid-template-rows: minmax(0, 1fr) 5px var(--assetsH);
            min-width: 0;
            min-height: 0;
        }

        #splitR {
            grid-column: 2;
            grid-row: 2;
            background: var(--bg);
            cursor: col-resize;
        }

        #inspector {
            grid-column: 3;
            grid-row: 2;
            background: var(--panel);
            overflow: auto;
            min-height: 0;
        }

        #splitH {
            background: var(--bg);
            cursor: row-resize;
        }

            #splitR:hover,
            #splitH:hover,
            .split.drag {
                background: var(--brass-dim);
            }

        /* ---- top bar ---- */
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14px;
            margin-right: 4px;
            white-space: nowrap;
        }

            .brand svg {
                width: 20px;
                height: 20px;
                color: var(--brass);
            }

        .field {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
        }

            .field input {
                background: var(--sunk);
                border: 1px solid var(--line);
                border-radius: 3px;
                padding: 4px 8px;
                color: var(--text);
                width: 170px;
            }

        .group {
            display: flex;
            gap: 6px;
            padding-left: 10px;
            border-left: 1px solid var(--line-soft);
        }

        .spacer {
            flex: 1;
            min-width: 8px;
        }

        .btn {
            background: var(--raised);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 4px 11px;
            cursor: pointer;
            color: var(--text);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

            .btn:hover {
                border-color: #47525d;
                background: #2a323a;
            }

            .btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }

            .btn.primary {
                background: var(--brass);
                border-color: var(--brass);
                color: #16130a;
                font-weight: 600;
            }

                .btn.primary:hover {
                    background: #d8b66a;
                }

            .btn.small {
                padding: 2px 8px;
                font-size: 12px;
            }

            .btn.danger:hover {
                border-color: var(--err);
                color: var(--err);
            }

        .icon-btn {
            background: none;
            border: 0;
            color: var(--muted);
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 3px;
            line-height: 1;
            display: inline-flex;
        }

            .icon-btn:hover {
                color: var(--text);
                background: var(--raised);
            }

            .icon-btn:disabled {
                opacity: 0.35;
                cursor: default;
            }

        .badge {
            font: 11px var(--mono);
            padding: 0 6px;
            border-radius: 8px;
            background: var(--raised);
            color: var(--muted);
        }

            .badge.err {
                background: var(--err);
                color: #190807;
            }

            .badge.warn {
                background: var(--warn);
                color: #1b1304;
            }

            .badge.ok {
                background: #2c4a43;
                color: var(--ok);
            }

        .menu {
            position: relative;
        }

        .menu-pop {
            position: fixed;
            min-width: 200px;
            background: var(--raised);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 4px;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
            display: none;
        }

            .menu-pop.open {
                display: block;
            }

            .menu-pop button {
                display: flex;
                align-items: center;
                gap: 8px;
                width: 100%;
                text-align: left;
                background: none;
                border: 0;
                padding: 6px 8px;
                border-radius: 3px;
                cursor: pointer;
            }

                .menu-pop button:hover {
                    background: var(--brass-wash);
                }

        /* ---- viewer (green) ---- */
        #viewer {
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
        }

        #viewbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            height: 36px;
            flex: none;
            background: var(--panel);
            border-bottom: 1px solid var(--line-soft);
            min-width: 0;
        }

        #viewTitle {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

            #viewTitle small {
                color: var(--muted);
                font-weight: 400;
                margin-left: 8px;
            }

        #viewTools {
            display: flex;
            gap: 6px;
            margin-left: auto;
            align-items: center;
            min-width: 0;
            overflow-x: auto;
            padding: 2px 0;
        }

            #viewTools > * {
                flex: none;
            }

        .seg {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: 3px;
            overflow: hidden;
        }

            .seg button {
                background: var(--raised);
                border: 0;
                border-right: 1px solid var(--line);
                padding: 2px 9px;
                cursor: pointer;
                color: var(--muted);
            }

                .seg button:last-child {
                    border-right: 0;
                }

                .seg button.on {
                    background: var(--brass-wash);
                    color: var(--brass);
                }

                .seg button:hover {
                    color: var(--text);
                }

        #viewport {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background: linear-gradient(rgba(120, 150, 175, 0.07) 1px, transparent 1px) 0 0/24px 24px, linear-gradient(90deg, rgba(120, 150, 175, 0.07) 1px, transparent 1px) 0 0/24px 24px, radial-gradient(ellipse at 50% 40%, #1d252d 0%, #12161a 75%);
        }

            #viewport.bgchk {
                background: conic-gradient(#2a3036 25%, #3a424a 0 50%, #2a3036 0 75%, #3a424a 0) 0 0/24px 24px;
            }

            #viewport canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: none;
                touch-action: none;
                cursor: grab;
            }

                #viewport canvas:active {
                    cursor: grabbing;
                }

            #viewport.mode-gl #gl,
            #viewport.mode-2d #c2d {
                display: block;
            }

        #textView {
            position: absolute;
            inset: 0;
            overflow: auto;
            display: none;
            padding: 16px 20px;
        }

        #viewport.mode-text #textView {
            display: block;
        }

        #viewMsg {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--muted);
            padding: 30px;
            line-height: 1.7;
        }

        #viewport.mode-empty #viewMsg {
            display: flex;
        }

        #viewInfo {
            position: absolute;
            left: 10px;
            bottom: 8px;
            font: 11px var(--mono);
            color: var(--muted);
            background: rgba(16, 19, 22, 0.72);
            padding: 2px 8px;
            border-radius: 3px;
            pointer-events: none;
            display: none;
        }

        #viewport.mode-gl #viewInfo,
        #viewport.mode-2d #viewInfo {
            display: block;
        }

        .code {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0 14px;
            font: 12px/1.55 var(--mono);
        }

            .code pre {
                margin: 0;
                white-space: pre;
                tab-size: 4;
            }

            .code .ln {
                color: var(--faint);
                text-align: right;
                user-select: none;
            }

        .pipe {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            row-gap: 14px;
        }

        .stage {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 4px;
            padding: 10px 14px;
            min-width: 150px;
        }

            .stage .k {
                color: var(--muted);
                font-size: 12px;
            }

            .stage .v {
                font: 13px var(--mono);
                margin-top: 2px;
            }

            .stage.ok {
                border-color: #3f6b60;
            }

            .stage.miss {
                border-color: var(--warn);
            }

            .stage.none {
                border-style: dashed;
                color: var(--faint);
            }

        .wire {
            width: 34px;
            height: 2px;
            background: var(--line);
        }

        .tree {
            font: 13px var(--mono);
        }

            .tree .node {
                margin-left: 16px;
                border-left: 1px solid var(--line);
                padding-left: 12px;
            }

            .tree .nn {
                padding: 2px 0;
            }

        .chip {
            display: inline-block;
            background: var(--raised);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0 8px;
            margin-left: 6px;
            font: 11px var(--ui);
            color: var(--muted);
        }

        /* ---- asset panel (red) ---- */
        #assets {
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            background: var(--panel);
            border-top: 1px solid var(--line-soft);
        }

        .a-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-bottom: 1px solid var(--line-soft);
            flex: none;
            min-width: 0;
        }

        .crumbs {
            display: flex;
            align-items: center;
            gap: 2px;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
        }

            .crumbs button {
                background: none;
                border: 0;
                color: var(--muted);
                cursor: pointer;
                padding: 2px 5px;
                border-radius: 3px;
            }

                .crumbs button:hover {
                    color: var(--text);
                    background: var(--raised);
                }

                .crumbs button:last-child {
                    color: var(--text);
                }

            .crumbs .sep {
                color: var(--faint);
            }

        .a-bar input[type="search"] {
            margin-left: auto;
            background: var(--sunk);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 3px 8px;
            width: 170px;
            color: var(--text);
        }

        .a-body {
            flex: 1;
            display: grid;
            grid-template-columns: var(--tree) minmax(0, 1fr);
            min-height: 0;
        }

        #tree {
            overflow: auto;
            border-right: 1px solid var(--line-soft);
            padding: 6px 0;
            background: #171b1f;
        }

        .trow {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            cursor: pointer;
            white-space: nowrap;
            border-left: 2px solid transparent;
        }

            .trow:hover {
                background: #20262c;
            }

            .trow.sel {
                background: var(--brass-wash);
                border-left-color: var(--brass);
            }

            .trow.drop {
                outline: 1px dashed var(--brass);
                outline-offset: -2px;
            }

            .trow .chev {
                width: 10px;
                height: 10px;
                flex: none;
                color: var(--faint);
                transition: transform 0.12s;
            }

                .trow .chev.closed {
                    transform: rotate(-90deg);
                }

                .trow .chev.none {
                    visibility: hidden;
                }

            .trow svg.i {
                color: var(--muted);
            }

            .trow.sel svg.i {
                color: var(--brass);
            }

            .trow .nm {
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .trow.stub {
                color: var(--faint);
                font-style: italic;
            }

        .tsec {
            padding: 8px 10px 3px;
            color: var(--faint);
            font-size: 12px;
        }

        #tiles {
            overflow: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
            gap: 8px;
            align-content: start;
        }

        .tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 4px;
            border-radius: 4px;
            border: 1px solid transparent;
            cursor: pointer;
            min-width: 0;
            position: relative;
        }

            .tile:hover {
                background: #20262c;
            }

            .tile.sel {
                background: var(--brass-wash);
                border-color: var(--brass-dim);
            }

            .tile.drop {
                outline: 1px dashed var(--brass);
            }

        .thumb {
            width: 68px;
            height: 68px;
            border-radius: 3px;
            background: var(--sunk);
            border: 1px solid var(--line-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--muted);
        }

            .thumb canvas {
                width: 100%;
                height: 100%;
                display: block;
            }

            .thumb svg.i {
                width: 30px;
                height: 30px;
            }

            .thumb .swatch {
                width: 42px;
                height: 42px;
                border-radius: 50%;
                box-shadow: inset -6px -8px 12px rgba(0, 0, 0, 0.45), inset 5px 5px 8px rgba(255, 255, 255, 0.22);
            }

        .tile .nm {
            font-size: 12px;
            text-align: center;
            line-height: 1.25;
            max-width: 100%;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-word;
        }

        .tile .dot {
            position: absolute;
            top: 6px;
            right: 8px;
        }

        .tile .lock {
            position: absolute;
            top: 6px;
            left: 8px;
            color: var(--faint);
        }

            .tile .lock svg {
                width: 11px;
                height: 11px;
            }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex: none;
        }

            .dot.err {
                background: var(--err);
            }

            .dot.warn {
                background: var(--warn);
            }

        .empty {
            padding: 22px 16px;
            color: var(--faint);
            line-height: 1.7;
            grid-column: 1/-1;
        }

            .empty b {
                color: var(--muted);
                font-weight: 600;
            }

        /* ---- settings panel (blue) ---- */
        .ins-head {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line-soft);
        }

        .ins-type {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--brass);
            margin-bottom: 8px;
        }

        .sec {
            border-bottom: 1px solid var(--line-soft);
            padding: 10px 14px 12px;
        }

            .sec > h3 {
                margin: 0 0 8px;
                font-size: 13px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 8px;
            }

                .sec > h3 .grow {
                    flex: 1;
                }

        .row {
            display: grid;
            grid-template-columns: 104px minmax(0, 1fr);
            gap: 8px;
            align-items: center;
            margin: 5px 0;
        }

            .row > label {
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .row input[type="text"],
            .row input[type="number"],
            .row select,
            .row textarea,
            .xrow input[type="text"],
            .xrow input[type="number"],
            .xrow select {
                width: 100%;
                background: var(--sunk);
                border: 1px solid var(--line);
                border-radius: 3px;
                padding: 3px 7px;
                min-width: 0;
            }

            .row input[type="range"] {
                width: 100%;
                accent-color: var(--brass);
            }

            .row input[type="color"] {
                width: 34px;
                height: 24px;
                padding: 0;
                border: 1px solid var(--line);
                background: var(--sunk);
                border-radius: 3px;
            }

            .row input[type="checkbox"] {
                justify-self: start;
            }

            .row select option,
            .row select optgroup {
                background: var(--raised);
            }

            .row .pair {
                display: flex;
                gap: 6px;
                align-items: center;
            }

                .row .pair input[type="number"] {
                    width: 72px;
                }

            .row .ro {
                font: 12px var(--mono);
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .row.stack {
                grid-template-columns: 1fr;
            }

        textarea.src {
            font: 12px/1.5 var(--mono);
            min-height: 220px;
            resize: vertical;
            white-space: pre;
            tab-size: 4;
        }

        .note {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
            margin: 6px 0;
        }

            .note.warn {
                color: var(--warn);
            }

            .note.err {
                color: var(--err);
            }

            .note.ok {
                color: var(--ok);
            }

        .slot summary {
            cursor: pointer;
            color: var(--muted);
        }

        .slot-head {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

            .slot-head .grow {
                flex: 1;
            }

        .xrow {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 78px minmax(0, 1fr) 22px;
            gap: 6px;
            margin: 5px 0;
            align-items: center;
        }

        .sug {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .mstat {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 2px 0;
            font-size: 12px;
        }

        .mono {
            font-family: var(--mono);
        }

        pre.gen {
            margin: 0;
            font: 12px/1.5 var(--mono);
            white-space: pre-wrap;
            word-break: break-all;
            background: var(--sunk);
            border: 1px solid var(--line-soft);
            border-radius: 3px;
            padding: 8px;
            max-height: 260px;
            overflow: auto;
        }

        .prob {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 4px 6px;
            border-radius: 3px;
            cursor: pointer;
        }

            .prob:hover {
                background: var(--raised);
            }

            .prob .dot {
                margin-top: 6px;
            }

            .prob .who {
                color: var(--muted);
                flex: none;
                min-width: 130px;
            }

        .reflist .rr {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
        }

            .reflist .rr .nm {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

        [hidden] {
            display: none !important;
        }

        .row .pair select {
            width: auto;
            flex: 1;
        }

        /* ---- themed form controls ---- */
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            margin: 0;
            border: 1px solid #4a5560;
            border-radius: 3px;
            background: var(--sunk);
            display: inline-grid;
            place-content: center;
            cursor: pointer;
            flex: none;
            transition: background 0.1s, border-color 0.1s;
        }

            input[type="checkbox"]:hover {
                border-color: var(--brass-dim);
            }

            input[type="checkbox"]:checked {
                background: var(--brass);
                border-color: var(--brass);
            }

                input[type="checkbox"]:checked::after {
                    content: "";
                    width: 8px;
                    height: 4px;
                    border-left: 2px solid #16130a;
                    border-bottom: 2px solid #16130a;
                    transform: translateY(-1px) rotate(-45deg);
                }

            input[type="checkbox"]:disabled {
                opacity: 0.45;
                cursor: default;
            }

        input[type="range"] {
            appearance: none;
            -webkit-appearance: none;

    <script>
        'use strict';
        /* ==========================================================================
           Gears bundle maker
           Writes the bundle folder the Gears AssetBundleLoader reads:
             Bundle.nlabf, Metadata/<folders>/<Type>_<name>.nlam, Assets/<folders>/<file>
           ========================================================================== */

        const $ = (s, r) => (r || document).querySelector(s);

        function el(tag, props) {
            const e = document.createElement(tag);
            if (props)
                for (const k in props) {
                    const v = props[k];
                    if (v === false || v == null) continue;
                    if (k === 'class') e.className = v;
                    else if (k === 'text') e.textContent = v;
                    else if (k === 'value') e.value = v;
                    else if (k === 'checked') e.checked = !!v;
                    else if (k === 'disabled') e.disabled = !!v;
                    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
                    else e.setAttribute(k, v === true ? '' : String(v));
                }
            for (let i = 2; i < arguments.length; i++) appendKid(e, arguments[i]);
            return e;
        }
        function appendKid(e, c) {
            if (c == null || c === false) return;
            if (Array.isArray(c)) {
                for (const x of c) appendKid(e, x);
                return;
            }
            e.append(c.nodeType ? c : document.createTextNode(String(c)));
        }
        function icon(name, cls) {
            const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            s.setAttribute('class', 'i' + (cls ? ' ' + cls : ''));
            const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
            u.setAttribute('href', '#i-' + name);
            s.appendChild(u);
            return s;
        }

        // ---------- asset type registry ----------
        const assetTypes = new Map(); // type id -> definition
        const unknownTypes = new Map();

        function registerAssetType(definition) {
            if (!definition.id || !definition.label) throw new Error('An asset type needs an id and a label.');
            const plural = definition.plural || definition.label + 's';
            const type = {
                format: 'binary',
                extensions: [],
                fixedExtension: '',
                settings: {},
                extraPresets: [],
                layout: null,
                view: { kind: 'none' },
                ...definition,
                plural,
                folder: definition.folder || plural
            };
            assetTypes.set(type.id, type);
            addTypeIcon(type);
            return type;
        }

        function typeOf(assetOrId) {
            const id = typeof assetOrId === 'string' ? assetOrId : assetOrId.type;
            if (assetTypes.has(id)) return assetTypes.get(id);
            if (!unknownTypes.has(id)) {
                unknownTypes.set(id, {
                    id,
                    label: id,
                    plural: id + 's',
                    folder: id + 's',
                    format: 'binary',
                    extensions: [],
                    fixedExtension: '',
                    settings: {},
                    extraPresets: [],
                    layout: null,
                    view: { kind: 'none' },
                    unknown: true
                });
            }
            return unknownTypes.get(id);
        }

        const typeList = () => Array.from(assetTypes.values());
        const typeIndex = id => {
            const index = typeList().findIndex(type => type.id === id);
            return index < 0 ? 999 : index;
        };
        const isCreatable = type =>
            (type.format === 'json' && !!type.create) ||
            (type.format === 'text' && !!type.starter) ||
            !!type.createBytes;

        const lineIcon = (...paths) =>
            paths
                .map(
                    d =>
                        '<path d="' +
                        d +
                        '" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>'
                )
                .join('');

        function addTypeIcon(type) {
            const old = document.getElementById('i-' + type.id);
            if (old) old.remove();
            if (!type.icon) return;
            $('#iconSprite').insertAdjacentHTML(
                'beforeend',
                '<symbol id="i-' + type.id + '" viewBox="0 0 16 16">' + type.icon + '</symbol>'
            );
        }
        function typeIcon(assetOrId) {
            const type = typeOf(assetOrId);
            return icon(assetTypes.has(type.id) && type.icon ? type.id : 'file');
        }

        // ---------- asset types ----------
        const ENUM = {
            wrap: ['Repeat', 'MirroredRepeat', 'ClampToEdge', 'ClampToBorder'],
            filter: ['Nearest', 'Linear'],
            mipmap: ['NearestMipmapNearest', 'NearestMipmapLinear', 'LinearMipmapNearest', 'LinearMipmapLinear'],
            pixel: ['Rgba', 'Rgb', 'Rg', 'Bgr', 'Bgra', 'Red', 'Green', 'Blue', 'Alpha'],
            target: ['Texture2D', 'TextureCubeMap'],
            comps: ['RedGreenBlueAlpha', 'RedGreenBlue', 'GreyAlpha', 'Grey', 'Default']
        };
        const TEXKEYS = [
            ['TextureWrap', 'wrap'],
            ['TextureFilter', 'filter'],
            ['Mipmap', 'mipmap'],
            ['PixelFormat', 'pixel'],
            ['TextureTarget', 'target'],
            ['ColorComponents', 'comps']
        ];
        const LEGACY_TEXKEYS = {
            TextureWarp: 'wrap',
            TexturePixel: 'pixel',
            TextureType: 'target',
            TextureMipmap: 'mipmap'
        };
        const SEMANTICS = ['albedo', 'normal', 'roughness', 'metallic', 'emission', 'ao', 'height', 'opacity'];
        const TEX_TYPES = [
            ['albedo', 'Albedo'],
            ['normal', 'Normal'],
            ['roughness', 'Roughness'],
            ['metallic', 'Metallic'],
            ['emission', 'Emission'],
            ['ao', 'Ambient occlusion'],
            ['height', 'Height'],
            ['opacity', 'Opacity']
        ];
        const TEX_GUESS = {
            albedo: /albedo|diffuse|base.?colou?r|colou?r/i,
            normal: /normal|nrm/i,
            roughness: /rough/i,
            metallic: /metal/i,
            emission: /emi[st]/i,
            ao: /(^|[^a-z])ao([^a-z]|$)|occlusion/i,
            height: /height|disp|bump/i,
            opacity: /opacity|alpha/i
        };
        const SAMPLER_FIELDS = ['wrap', 'filter', 'mipmap'];
        const FORMAT_FIELDS = ['pixel', 'target', 'comps'];
        const SAMPLER_PRESETS = [
            ['default', 'Engine default', {}],
            ['smooth', 'Smooth tiling', { wrap: 'Repeat', filter: 'Linear', mipmap: 'LinearMipmapLinear' }],
            ['pixel', 'Pixel art (sharp)', { wrap: 'Repeat', filter: 'Nearest', mipmap: 'NearestMipmapNearest' }],
            ['clamp', 'Clamped (UI, decals)', { wrap: 'ClampToEdge', filter: 'Linear', mipmap: 'LinearMipmapNearest' }],
            ['mirror', 'Mirrored tiling', { wrap: 'MirroredRepeat', filter: 'Linear', mipmap: 'LinearMipmapLinear' }]
        ];

        function samplerPresetOf(slot) {
            for (const [id, , values] of SAMPLER_PRESETS) {
                if (SAMPLER_FIELDS.every(field => (slot[field] || '') === (values[field] || ''))) return id;
            }
            return 'custom';
        }

        function applySampler(slot, presetId) {
            const preset = SAMPLER_PRESETS.find(p => p[0] === presetId);
            if (!preset) return;
            for (const field of SAMPLER_FIELDS) slot[field] = preset[2][field] || '';
        }

        // ---------- state ----------
        const state = {
            bundle: { name: 'New bundle', uuid: uuid4(), refList: [] },
            assets: [],
            folders: new Set(),

        // ---------- material (.nlmf) ----------

        // Shader asset: merge the uniforms of every used raw shader stage (first type wins on a name clash).
        function syncShaderUniforms(asset) {
            const sh = asset.data,
                stages = sh.Drawable ? ['Vertex', 'Geometry', 'Fragment'] : ['Compute'],
                out = [];
            for (let i = 0; i < stages.length; i++) {
                const name = sh[stages[i]];
                if (!name) continue;
                const raw = findAsset('RawShader', name);
                if (!raw) continue;
                const list = rawList(raw, 'uniforms');
                for (let u = 0; u < list.length; u++) {
                    let dup = null;
                    for (let o = 0; o < out.length; o++)
                        if (out[o].name === list[u].name) {
                            dup = out[o];
                            break;
                        }
                    if (dup) {
                        if (dup.location < 0 && list[u].location >= 0) dup.location = list[u].location;
                        if (dup.binding !== undefined && dup.binding < 0 && list[u].binding >= 0)
                            dup.binding = list[u].binding;
                        continue;
                    }
                    const c = { type: list[u].type, name: list[u].name, location: list[u].location };
                    if (list[u].binding !== undefined) c.binding = list[u].binding;
                    out.push(c);
                }

            for (let k = 0; k < asset.extra.length; k++)

                st = [],
                raws = [];
            for (let i = 0; i < 3; i++) {
                const name = shader[names[i]];
                if (!name) continue;
                const raw = findAsset('RawShader', name);
                if (!raw) return -1;
                st.push(names[i]);
                raws.push(raw);
            }
            if (st[0] !== 'Vertex' || st[st.length - 1] !== 'Fragment') return -1;
            let bad = 0;
            for (let s = 1; s < st.length; s++) {
                const outs = rawList(raws[s - 1], 'outs'),
                    ins = rawList(raws[s], 'ins'),
                    geo = st[s] === 'Geometry';
                for (let i = 0; i < ins.length; i++) {
                    const a = ins[i];
                    let m = null;

                                m = outs[o];
                                break;
                            }

                    if (ty !== m.type) {

                            'err',

                        );
                        bad++;

                }
                const us = rawList(raws[s], 'uniforms');
                for (let p = 0; p < s; p++) {
                    const ps = rawList(raws[p], 'uniforms');
                    for (let i = 0; i < us.length; i++)
                        for (let k = 0; k < ps.length; k++)
                            if (ps[k].name === us[i].name && ps[k].type !== us[i].type) {
                                report(
                                    'err',
                                    'Uniform "' + us[i].name + '" is ' + ps[k].type + ' in ' + st[p] + ' and ' + us[i].type + ' in ' + st[s] + '.'
                                );

        function nlamObj(asset) {
            const meta = typeOf(asset).syncMeta;
            if (meta) meta(asset);

            if (asset.extra.length) o.Extra = asset.extra.map(e => ({ Key: e.k, Value: e.v }));
            return o;
        }
        function nlabfObj() {
            const o = { Name: state.bundle.name, Asset: state.assets.map(a => a.id), UUID: state.bundle.uuid };
            if (state.bundle.refList.length)
                o.References = state.bundle.refList.map(r => ({ Name: r.name, UUID: r.uuid }));
            return o;
        }
        function buildFiles() {
            const files = [{ path: 'Bundle.nlabf', data: enc.encode(jsonMin(nlabfObj())) }];
            for (const a of state.assets) {
                files.push({ path: 'Metadata/' + metaRel(a), data: enc.encode(jsonMin(nlamObj(a))) });

        // ---------- ZIP (stored) ----------

            const dosDate = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xffff;
            for (const f of files) {
                const name = enc.encode((prefix || '') + f.path),
                    crc = crc32(f.data),
                    size = f.data.length;
                const lh = new DataView(new ArrayBuffer(30));
                lh.setUint32(0, 0x04034b50, true);
                lh.setUint16(4, 20, true);
                lh.setUint16(6, 0x0800, true);
                lh.setUint16(8, 0, true);
                lh.setUint16(10, dosTime, true);
                lh.setUint16(12, dosDate, true);
                lh.setUint32(14, crc, true);
                lh.setUint32(18, size, true);
                lh.setUint32(22, size, true);
                lh.setUint16(26, name.length, true);
                lh.setUint16(28, 0, true);

                const ch = new DataView(new ArrayBuffer(46));
                ch.setUint32(0, 0x02014b50, true);
                ch.setUint16(4, 20, true);
                ch.setUint16(6, 20, true);
                ch.setUint16(8, 0x0800, true);
                ch.setUint16(10, 0, true);
                ch.setUint16(12, dosTime, true);
                ch.setUint16(14, dosDate, true);
                ch.setUint32(16, crc, true);
                ch.setUint32(20, size, true);
                ch.setUint32(24, size, true);
                ch.setUint16(28, name.length, true);

            for (const c of central) cd += c.length;

            end.setUint32(0, 0x06054b50, true);

            end.setUint16(10, files.length, true);
            end.setUint32(12, cd, true);
            end.setUint32(16, offset, true);

            for (const p of all) total += p.length;

            for (const p of all) {

        /* ==========================================================================

           ========================================================================== */
        function newAsset(overrides) {
            return Object.assign(
                {
                    id: uuid4(),
                    type: '',
                    name: '',
                    ext: '',
                    folder: '',
                    bytes: null,
                    text: null,
                    data: null,
                    extra: [],
                    ref: null

                overrides

        }

            state.nav.ref == null && state.nav.path ? state.nav.path : typeOf(typeId).folder;

            asset.name = uniqueName(asset.type, asset.name, null);
            state.assets.push(asset);
            ensureFolder(asset.folder);
            state.dirty = true;
            return asset;
        }
        function cloneAsset(asset) {
            const copy = Object.assign({}, asset, {
                id: uuid4(),

                data: asset.data ? JSON.parse(JSON.stringify(asset.data)) : null

            asset.text = type.format === 'text' ? '' : null;
            asset.data = type.format === 'json' ? (type.create ? type.create() : {}) : null;
        }

        function fillAsset(asset, bytes, warnings) {
            const type = typeOf(asset);
            try {
                if (type.format === 'binary') {
                    asset.bytes = bytes;
                    return;
                }
                const text = decodeText(bytes);
                if (type.format === 'json') asset.data = type.read ? type.read(text) : JSON.parse(text);
                else asset.text = type.jsonText ? prettyJson(text) : text;
            } catch (error) {
                if (warnings) warnings.push(type.label + ' "' + asset.name + '": ' + error.message);
                resetPayload(asset);
            }
        }

        function createAsset(typeId, name) {
            const type = typeOf(typeId);
            const asset = newAsset({
                type: type.id,
                name: name || type.newName || 'New ' + type.label.toLowerCase(),
                ext: type.fixedExtension || type.extensions[0] || '',
                folder: defaultFolder(type.id)
            });
            resetPayload(asset);
            applySettingDefaults(asset);
            addAsset(asset);
            if (type.format === 'text' && type.starter) asset.text = type.starter(asset);
            if (type.format === 'binary' && type.createBytes) asset.bytes = type.createBytes(asset);
            if (type.onCreate) type.onCreate(asset);
            return asset;
        }

        async function importFile(file, folderOverride) {
            const ext = extOf(file.name);
            const type = typeForExt(ext);
            if (!type) throw new Error('"' + file.name + '" is not a supported file type.');
            const bytes = await readBytes(file);
            const asset = newAsset({
                type: type.id,
                name: stemOf(file.name),
                ext: type.fixedExtension || ext,
                folder: folderOverride != null ? folderOverride : defaultFolder(type.id)
            });
            const warnings = [];
            fillAsset(asset, bytes, warnings);
            if (warnings.length) throw new Error(warnings[0]);
            applySettingDefaults(asset);
            return addAsset(asset);
        }
        async function importFiles(list, folderOverride) {
            let first = null,
                n = 0;
            for (const f of Array.from(list)) {
                try {
                    const a = await importFile(f, folderOverride);
                    if (!first) first = a;
                    n++;
                } catch (e) {
                    toast(e.message, true);
                }
            }
            if (first) {
                state.nav = { ref: null, path: first.folder };
                select(first);
                toast('Imported ' + n + ' asset' + (n === 1 ? '' : 's') + '.');
            }
            refreshAll();
        }

        function setModelMaterial(asset, from, to) {
            asset.text = rewriteUsemtl(asset.text || '', from, to);
            delete asset._obj;
            disposeAssetGL(asset);
            state.dirty = true;
        }

        function renameAsset(asset, wanted) {
            const old = asset.name;
            const unique = uniqueName(asset.type, wanted, asset);
            if (unique === old) return old;
            asset.name = unique;
            const type = typeOf(asset);
            if (type.onRename) type.onRename(asset, old, unique);
            state.dirty = true;
            return unique;
        }
        function moveAsset(asset, folder) {
            asset.folder = folder;

            const i = state.assets.indexOf(asset);
            if (i < 0) return;
            const type = typeOf(asset);
            if (type.dispose) type.dispose(asset);
            state.assets.splice(i, 1);
            disposeAssetGL(asset);

            if (state.pin === asset) state.pin = null;
            if (state.sel === asset) select(null);
        }
        function newFolder(parent, name) {
            name = cleanName(name);

            state.dirty = true;
            return p;
        }
        function renameFolder(path, name) {
            name = cleanName(name);
            if (!name) return null;
            const np = joinPath(parentPath(path), name);
            if (np === path) return path;
            if (allFolders().has(np)) {
                toast('A folder named "' + name + '" already exists here.', true);
                return null;
            }
            const re = p => (p === path ? np : p.startsWith(path + '/') ? np + p.slice(path.length) : p);

            for (const asset of state.assets) asset.folder = re(asset.folder);

            const inside = p => p === path || p.startsWith(path + '/');

            if (
                victims.length &&
                !confirm('Delete folder "' + path + '" and the ' + victims.length + ' asset(s) in it?')
            )
                return false;

            state.folders = new Set(Array.from(state.folders).filter(p => !inside(p)));
            state.nav = { ref: null, path: parentPath(path) };
            state.dirty = true;
            return true;
        }

        function changeAssetType(asset, newTypeId) {
            if (asset.type === newTypeId || !assetTypes.has(newTypeId)) return { ok: false };
            const oldType = typeOf(asset);
            const newType = typeOf(newTypeId);
            const notes = [];
            const oldBytes = oldType.format === 'binary' ? asset.bytes || new Uint8Array(0) : null;
            const text = oldBytes ? decodeText(oldBytes) : assetText(asset);
            const bytes = oldBytes || enc.encode(text);

            if (oldType.dispose) oldType.dispose(asset);
            disposeAssetGL(asset);

                newType.fixedExtension ||
                (newType.extensions.includes(asset.ext) ? asset.ext : newType.extensions[0] || asset.ext);

                    asset.data = newType.read ? newType.read(text) : JSON.parse(text);
                } catch (error) {

                }

            if (asset.name !== oldName)
                notes.push(
                    'Renamed to "' + asset.name + '" because another ' + newType.label.toLowerCase() + ' had that name.'

            return { ok: true, notes };
        }

        // ---------- image decode ----------
        function ensureImage(asset) {
            if (asset._imgP) return asset._imgP;
            asset._imgP = (async () => {
                try {
                    const bmp = await createImageBitmap(new Blob([asset.bytes], { type: MIME[asset.ext] || 'image/png' }));
                    asset._img = bmp;
                    asset._info = { w: bmp.width, h: bmp.height };
                } catch (e) {
                    asset._imgFail = true;
                }
                scheduleUI();
                return asset._img || null;
            })();
            return asset._imgP;
        }
        const getObj = asset => asset._obj || (asset._obj = parseOBJ(asset.text || ''));

        // ---------- problems ----------
        function computeProblems() {
            const problems = [];
            const add = (severity, asset, message) => problems.push({ sev: severity, a: asset, msg: message });
            const nameCount = new Map(),
                idCount = new Map(),
                pathCount = new Map();
            const count = (map, key) => map.set(key, (map.get(key) || 0) + 1);
            for (const asset of state.assets) {
                count(nameCount, asset.type + '|' + asset.name);
                count(idCount, asset.id);
                if (hasFile(asset)) count(pathCount, assetRel(asset).toLowerCase());
            }
            for (const asset of state.assets) {
                const type = typeOf(asset);
                if (!asset.name) add('err', asset, 'The name is empty.');
                if (nameCount.get(asset.type + '|' + asset.name) > 1)
                    add('err', asset, 'Duplicate name. The engine finds assets by name.');
                if (idCount.get(asset.id) > 1) add('err', asset, 'Another asset has the same UUID.');
                if (hasFile(asset) && pathCount.get(assetRel(asset).toLowerCase()) > 1)
                    add('err', asset, 'Another asset is written to the same file: ' + assetRel(asset));
                for (const ref of state.refs) {
                    if (ref.assets.some(x => x.type === asset.type && x.name === asset.name))
                        add('warn', asset, 'Also in reference bundle "' + ref.name + '".');
                }
                if (type.unknown)
                    add(
                        'warn',
                        asset,
                        'The type "' + asset.type + '" is not defined in this tool, so it is kept as a plain file.'
                    );
                if (type.problems) type.problems(asset, (severity, message) => add(severity, asset, message));
            }
            if (!state.bundle.name.trim()) add('warn', null, 'The bundle has no name.');
            if (!state.assets.length) add('warn', null, 'The bundle has no assets yet.');
            return problems;
        }

        // ---------- bundle IO ----------
        async function walkDir(dir, prefix, out) {
            for await (const [name, handle] of dir.entries()) {
                if (handle.kind === 'file') out.push({ path: prefix + name, file: await handle.getFile() });
                else await walkDir(handle, prefix + name + '/', out);
            }
        }
        async function pickBundleFiles() {
            if (window.showDirectoryPicker) {
                try {
                    const dir = await window.showDirectoryPicker();
                    const files = [];
                    await walkDir(dir, '', files);
                    return { name: dir.name, files };
                } catch (e) {
                    if (e && e.name === 'AbortError') return null;
                    throw e;
                }
            }
            return new Promise(resolve => {
                const inp = $('#dirInput');
                inp.value = '';
                inp.onchange = () => {
                    const list = Array.from(inp.files);
                    if (!list.length) return resolve(null);
                    const root = list[0].webkitRelativePath.split('/')[0];
                    resolve({
                        name: root,
                        files: list.map(f => ({ path: f.webkitRelativePath.split('/').slice(1).join('/'), file: f }))
                    });
                };
                inp.click();
            });
        }

        async function parseBundle(files, dirName) {
            const byLower = new Map(),
                warnings = [];
            for (const f of files) byLower.set(f.path.toLowerCase(), f);
            let nlabf = null;
            const nb = byLower.get('bundle.nlabf');
            if (nb) {
                try {
                    nlabf = JSON.parse(decodeText(await readBytes(nb.file)));
                } catch (e) {
                    warnings.push('Bundle.nlabf is not valid JSON.');
                }
            } else warnings.push('No Bundle.nlabf found. Is this a bundle folder?');
            const bundle = {
                name: (isObj(nlabf) && typeof nlabf.Name === 'string' && nlabf.Name) || dirName || 'Bundle',
                uuid: (isObj(nlabf) && typeof nlabf.UUID === 'string' && nlabf.UUID) || uuid4(),
                refList: []
            };
            if (isObj(nlabf) && Array.isArray(nlabf.References))
                for (const r of nlabf.References)
                    if (isObj(r)) bundle.refList.push({ name: String(r.Name || ''), uuid: String(r.UUID || '') });
            const assets = [],
                folders = new Set();
            const metas = files
                .filter(f => /^metadata\//i.test(f.path) && /\.nlam$/i.test(f.path))
                .sort((a, b) => a.path.localeCompare(b.path));
            for (const mf of metas) {
                let m;
                try {
                    m = JSON.parse(decodeText(await readBytes(mf.file)));
                } catch (e) {
                    warnings.push(mf.path + ' is not valid JSON, skipped.');
                    continue;
                }
                if (!isObj(m) || typeof m.Type !== 'string' || typeof m.Name !== 'string') {
                    warnings.push(mf.path + ' has no Type or no Name, skipped.');
                    continue;
                }
                const type = typeOf(m.Type);
                const loc = typeof m.Location === 'string' ? m.Location.replace(/\\/g, '/').replace(/^\/+/, '') : '';
                const asset = newAsset({ type: type.id, name: cleanName(m.Name) || type.label });
                if (typeof m.UUID === 'string' && m.UUID) asset.id = m.UUID;
                if (Array.isArray(m.Extra))
                    for (const e of m.Extra)
                        if (isObj(e) && typeof e.Key === 'string')
                            asset.extra.push({
                                k: e.Key,
                                v:
                                    typeof e.Value === 'number' || typeof e.Value === 'boolean' || Array.isArray(e.Value)
                                        ? e.Value
                                        : String(e.Value == null ? '' : e.Value)
                            });
                if (loc) {
                    asset.ext = extOf(loc) || type.extensions[0] || '';
                    asset.folder = parentPath(loc);
                    const af = byLower.get(('assets/' + loc).toLowerCase());
                    if (af) fillAsset(asset, await readBytes(af.file), warnings);
                    else {
                        warnings.push(type.label + ' "' + asset.name + '": asset file Assets/' + loc + ' is missing.');
                        fillAsset(asset, new Uint8Array(0), null);
                    }
                } else {
                    asset.ext = type.fixedExtension || type.extensions[0] || '';
                    asset.folder = type.folder;
                    fillAsset(asset, new Uint8Array(0), null);
                    if (type.format === 'text' && type.starter) asset.text = type.starter(asset);
                }
                assets.push(asset);
                for (let p = asset.folder; p; p = parentPath(p)) folders.add(p);
            }
            return { bundle, assets, folders, warnings };
        }

        async function openBundle() {
            if (state.assets.length && !confirm('Open another bundle? Unexported changes are lost.')) return;
            let picked;
            try {
                picked = await pickBundleFiles();
            } catch (e) {
                toast('Could not read the folder: ' + e.message, true);
                return;
            }
            if (!picked) return;
            const r = await parseBundle(picked.files, picked.name);
            for (const a of state.assets) disposeAssetGL(a);
            state.bundle = r.bundle;
            state.assets = r.assets;
            state.folders = r.folders;
            state.sel = null;
            state.nav = { ref: null, path: '' };
            state.dirty = false;
            state.refs = state.refs.filter(x => state.bundle.refList.some(l => l.uuid === x.uuid));
            toast(
                r.warnings.length
                    ? 'Opened with ' + r.warnings.length + ' warning(s): ' + r.warnings[0]
                    : 'Opened "' + state.bundle.name + '" (' + r.assets.length + ' assets).',
                r.warnings.length > 0
            );
            select(null);
            refreshAll();
        }

        // Registers an already-parsed bundle as a reference of the current bundle.
        function addParsedReference(r) {
            for (const asset of r.assets) asset.ref = r.bundle.uuid;
            const ref = { uuid: r.bundle.uuid, name: r.bundle.name, assets: r.assets, folders: r.folders };
            const old = state.refs.findIndex(x => x.uuid === ref.uuid);
            if (old >= 0) state.refs[old] = ref;
            else state.refs.push(ref);
            const li = state.bundle.refList.findIndex(x => x.uuid === ref.uuid);
            if (li >= 0) state.bundle.refList[li].name = ref.name;
            else state.bundle.refList.push({ name: ref.name, uuid: ref.uuid });
            state.nav = { ref: ref.uuid, path: '' };
            state.open.add('@' + ref.uuid);
            state.dirty = true;
            toast('Added reference "' + ref.name + '" (' + r.assets.length + ' assets).');
            refreshAll();
        }

        async function addReference() {
            let picked;
            try {
                picked = await pickBundleFiles();
            } catch (e) {
                toast('Could not read the folder: ' + e.message, true);
                return;
            }
            if (!picked) return;
            const r = await parseBundle(picked.files, picked.name);
            if (!r.assets.length) {
                toast('No assets found. Pick the folder that holds Bundle.nlabf.', true);
                return;
            }
            if (r.bundle.uuid === state.bundle.uuid) {
                toast('That is this bundle. Pick a different one.', true);
                return;
            }
            addParsedReference(r);
        }

        // Loads the ExGaming20/Gears default assets folder as a reference bundle.
        const DEFAULT_ASSETS_REPO = 'ExGaming20/Gears';
        const DEFAULT_ASSETS_BRANCH = 'main';
        const DEFAULT_ASSETS_PREFIX = 'Assets/Default Assets/';

        async function addDefaultReferenceBundle() {
            const btn = $('#btnAddDefaultRef');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Loading…';
            try {
                toast('Fetching default assets from GitHub…');
                const treeUrl = `https://api.github.com/repos/${DEFAULT_ASSETS_REPO}/git/trees/${DEFAULT_ASSETS_BRANCH}?recursive=1`;
                const treeResp = await fetch(treeUrl, { cache: 'no-store' });
                if (!treeResp.ok) throw new Error(`GitHub API ${treeResp.status}`);
                const treeData = await treeResp.json();
                const paths = treeData.tree
                    .filter(item => item.type === 'blob' && item.path.startsWith(DEFAULT_ASSETS_PREFIX))
                    .map(item => item.path.slice(DEFAULT_ASSETS_PREFIX.length));
                if (!paths.includes('Bundle.nlabf')) throw new Error('Bundle.nlabf not found in the default assets folder.');
                const baseRaw = `https://raw.githubusercontent.com/${DEFAULT_ASSETS_REPO}/${DEFAULT_ASSETS_BRANCH}/`;
                const files = await Promise.all(
                    paths.map(async relPath => {
                        const fullPath = DEFAULT_ASSETS_PREFIX + relPath;
                        const encodedPath = fullPath.split('/').map(encodeURIComponent).join('/');
                        const resp = await fetch(baseRaw + encodedPath, { cache: 'no-store' });
                        if (!resp.ok) throw new Error(`Failed to fetch ${relPath}: ${resp.status}`);
                        return { path: relPath, file: await resp.blob() };
                    })
                );
                const parsed = await parseBundle(files, 'Default Assets');
                if (!parsed.assets.length) throw new Error('No assets found in the default bundle.');
                if (parsed.bundle.uuid === state.bundle.uuid)
                    throw new Error('The default bundle is the same as the current bundle.');
                addParsedReference(parsed);
                toast(`Default reference bundle "${parsed.bundle.name}" loaded (${parsed.assets.length} assets).`);
            } catch (err) {
                console.error(err);
                toast('Failed to load default assets: ' + err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        function removeReference(uuid) {
            state.refs = state.refs.filter(x => x.uuid !== uuid);
            state.bundle.refList = state.bundle.refList.filter(x => x.uuid !== uuid);
            if (state.nav.ref === uuid) state.nav = { ref: null, path: '' };
            if (state.sel && state.sel.ref === uuid) select(null);
            state.dirty = true;

        function copyToBundle(a) {
            const c = cloneAsset(a);

        async function exportZip() {

            const blob = new Blob([makeZipBytes(files, base + '/')], { type: 'application/zip' });
            const a = el('a', { href: URL.createObjectURL(blob), download: base + '.zip' });

        async function exportFolder() {
            if (!window.showDirectoryPicker) {
                toast('This browser cannot write to folders. Use Chrome or Edge, or download the .zip.', true);
                return;
            }
            if (!confirmProblems()) return;
            let dir;
            try {
                dir = await window.showDirectoryPicker({ mode: 'readwrite' });
            } catch (e) {
                if (e && e.name === 'AbortError') return;
                toast(e.message, true);
                return;
            }
            let nonEmpty = false;
            for await (const _ of dir.entries()) {
                nonEmpty = true;
                break;
            }
            if (nonEmpty && !confirm('This folder is not empty. Files with the same name are overwritten. Continue?'))
                return;
            const files = buildFiles();
            try {
                for (const f of files) {
                    const parts = f.path.split('/');
                    let d = dir;
                    for (let i = 0; i < parts.length - 1; i++) d = await d.getDirectoryHandle(parts[i], { create: true });
                    const fh = await d.getFileHandle(parts[parts.length - 1], { create: true });
                    const w = await fh.createWritable();
                    await w.write(f.data);
                    await w.close();
                }
            } catch (e) {
                toast('Export failed: ' + e.message, true);
                return;
            }
            state.dirty = false;
            toast('Wrote ' + files.length + ' files into "' + dir.name + '".');
        }

        /* ==========================================================================
           Syntax highlighting. Token classes are colored in the CSS with the
           Visual Studio 2022 "Dark" theme colors.
           ========================================================================== */

        const CS_CONTROL = new Set([
            'break',
            'case',
            'catch',
            'continue',
            'default',
            'do',
            'else',
            'finally',
            'for',
            'foreach',
            'goto',
            'if',
            'return',
            'switch',
            'throw',
            'try',
            'while',
            'yield',
            'await'
        ]);
        const CS_KEYWORDS = new Set([
            'abstract', 'as', 'base', 'bool', 'byte', 'char', 'checked', 'class', 'const', 'decimal', 'delegate',
            'double', 'enum', 'event', 'explicit', 'extern', 'false', 'fixed', 'float', 'implicit', 'in', 'int',
            'interface', 'internal', 'is', 'lock', 'long', 'namespace', 'new', 'null', 'object', 'operator', 'out',
            'override', 'params', 'partial', 'private', 'protected', 'public', 'readonly', 'ref', 'sbyte', 'sealed',
            'short', 'sizeof', 'stackalloc', 'static', 'string', 'struct', 'this', 'true', 'typeof', 'uint', 'ulong',
            'unchecked', 'unsafe', 'ushort', 'using', 'var', 'virtual', 'void', 'volatile', 'get', 'set', 'init',
            'async', 'record', 'nameof', 'dynamic', 'where'
        ]);
        const CS_TYPE_INTRODUCERS = new Set(['class', 'struct', 'interface', 'enum', 'record', 'delegate']);
        const CS_TYPE_AFTER = new Set(['new', 'typeof', 'is', 'as']);

        const GLSL_CONTROL = new Set([
            'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default', 'break', 'continue', 'return', 'discard'
        ]);
        const GLSL_KEYWORDS = new Set(
            (
                'void bool int uint float double vec2 vec3 vec4 ivec2 ivec3 ivec4 uvec2 uvec3 uvec4 bvec2 bvec3 bvec4 dvec2 dvec3 dvec4 ' +
                'mat2 mat3 mat4 mat2x2 mat2x3 mat2x4 mat3x2 mat3x3 mat3x4 mat4x2 mat4x3 mat4x4 ' +
                'sampler1D sampler2D sampler3D samplerCube sampler2DShadow samplerCubeShadow sampler2DArray sampler2DArrayShadow ' +
                'isampler2D usampler2D sampler2DMS image1D image2D image3D imageCube atomic_uint ' +
                'const uniform in out inout attribute varying layout centroid flat smooth noperspective patch sample buffer shared ' +
                'coherent volatile restrict readonly writeonly precision highp mediump lowp invariant struct subroutine true false'
            ).split(' ')
        );

        const preprocessorPart = '(^[ \\t]*#[^\\n]*)';
        const joinPattern = parts => new RegExp(parts.join('|'), 'gm');

        const CS_PATTERN = joinPattern([
            '(\\/\\/\\/[^\\n]*)',
            '(\\/\\/[^\\n]*)',
            '(\\/\\*[\\s\\S]*?(?:\\*\\/|(?![\\s\\S])))',
            '((?:\\$@|@\\$|@)"(?:[^"]|"")*(?:"|(?![\\s\\S])))',
            '(\\$?"(?:\\\\.|[^"\\\\\\n])*"?)',
            "('(?:\\\\.|[^'\\\\\\n])*'?)",
            preprocessorPart,
            '(0[xX][0-9a-fA-F_]+[uUlL]*|\\d[\\d_]*(?:\\.\\d[\\d_]*)?(?:[eE][+-]?\\d+)?[fFdDmMuUlL]*|\\.\\d+(?:[eE][+-]?\\d+)?[fFdD]?)',
            '([A-Za-z_@]\\w*)',
            '([-+*/%=<>!&|^~?:]+)'
        ]);
        const GLSL_PATTERN = joinPattern([
            '(\\/\\/[^\\n]*)',
            '(\\/\\*[\\s\\S]*?(?:\\*\\/|(?![\\s\\S])))',
            preprocessorPart,
            '((?:0[xX][0-9a-fA-F]+|(?:\\d+\\.\\d*|\\.\\d+|\\d+)(?:[eE][+-]?\\d+)?)(?:[uU]|[fF]|lf|LF)?)',
            '([A-Za-z_]\\w*)',
            '([-+*/%=<>!&|^~?:]+)'
        ]);
        const JSON_PATTERN = joinPattern([
            '("(?:\\\\.|[^"\\\\\\n])*"?)',
            '(-?\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)',
            '\\b(true|false|null)\\b',
            '(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?(?:\\*\\/|(?![\\s\\S])))'
        ]);

        const nextSignificantChar = (text, from) => {
            let i = from;
            while (i < text.length && (text[i] === ' ' || text[i] === '\t')) i++;
            return text[i] || '';
        };
        const previousSignificantChar = (text, before) => {
            let i = before - 1;
            while (i >= 0 && (text[i] === ' ' || text[i] === '\t')) i--;
            return i >= 0 ? text[i] : '';
        };
        const lineStartOf = (text, index) => text.lastIndexOf('\n', index - 1) + 1;
        const isPascalCase = word => /^[A-Z]/.test(word);

        const DECLARED_NAME = /[ \t]+([A-Za-z_@]\w*)/y;

        function classifyCsIdentifier(text, word, index, previousWord) {
            if (CS_CONTROL.has(word)) return 'control';
            if (CS_KEYWORDS.has(word)) return 'keyword';

            const lineStart = lineStartOf(text, index);
            if (/^\s*(using|namespace)\b/.test(text.slice(lineStart, lineStart + 12))) return 'plain';

            const before = previousSignificantChar(text, index);
            const after = nextSignificantChar(text, index + word.length);
            const typeClass = /^I[A-Z]/.test(word) ? 'interface' : 'type';

            if (CS_TYPE_INTRODUCERS.has(previousWord)) return previousWord === 'interface' ? 'interface' : 'type';
            if (CS_TYPE_AFTER.has(previousWord) && isPascalCase(word)) return typeClass;
            if (after === '(') return 'method';
            if (before === '.') return 'plain';
            if (!isPascalCase(word)) return word[0] === '_' ? 'plain' : 'param';
            if (after === '.' || after === '<') return typeClass;
            if (
                (before === ':' || before === ',') &&
                /\b(class|struct|interface|record)\b/.test(text.slice(lineStart, index))
            )
                return typeClass;

            DECLARED_NAME.lastIndex = index + word.length;
            const declared = DECLARED_NAME.exec(text);
            const startsDeclaration =
                declared && !CS_CONTROL.has(declared[1]) && !['in', 'is', 'as'].includes(declared[1]);
            return startsDeclaration ? typeClass : 'plain';
        }

        function classifyGlslIdentifier(text, word, index) {
            if (GLSL_CONTROL.has(word)) return 'control';
            if (GLSL_KEYWORDS.has(word)) return 'keyword';
            return nextSignificantChar(text, index + word.length) === '(' ? 'method' : 'plain';
        }

        function preprocessorTokens(line) {
            const match = /^(\s*#\s*(?:define|undef|ifdef|ifndef))(\s+)([A-Za-z_]\w*)([\s\S]*)$/.exec(line);
            if (!match) return [['preproc', line]];
            return [
                ['preproc', match[1] + match[2]],
                ['macro', match[3]],
                ['preproc', match[4]]
            ];
        }

        function stringTokens(literal, verbatim) {
            if (verbatim) return [['string', literal]];
            const tokens = [];
            let last = 0;
            for (const match of literal.matchAll(/\\./g)) {
                if (match.index > last) tokens.push(['string', literal.slice(last, match.index)]);
                tokens.push(['escape', match[0]]);
                last = match.index + match[0].length;
            }
            if (last < literal.length) tokens.push(['string', literal.slice(last)]);
            return tokens;
        }

        function tokenize(text, language) {
            const pattern = { cs: CS_PATTERN, glsl: GLSL_PATTERN, json: JSON_PATTERN }[language];
            if (!pattern || text.length > 400000) return [['plain', text]];

            const tokens = [];
            let last = 0,
                previousWord = '';
            pattern.lastIndex = 0;
            for (let match = pattern.exec(text); match; match = pattern.exec(text)) {
                if (match[0] === '') {
                    pattern.lastIndex++;
                    continue;
                }
                if (match.index > last) tokens.push(['plain', text.slice(last, match.index)]);
                last = match.index + match[0].length;
                const group = match.findIndex((value, i) => i > 0 && value !== undefined);
                const value = match[0];

                if (language === 'cs') {
                    if (group === 1) tokens.push(['doc', value]);
                    else if (group === 2 || group === 3) tokens.push(['comment', value]);
                    else if (group === 4) tokens.push(...stringTokens(value, true));
                    else if (group === 5 || group === 6) tokens.push(...stringTokens(value, false));
                    else if (group === 7) tokens.push(['preproc', value]);
                    else if (group === 8) tokens.push(['number', value]);
                    else if (group === 9) {
                        tokens.push([classifyCsIdentifier(text, value, match.index, previousWord), value]);
                        previousWord = value;
                    } else tokens.push(['operator', value]);
                } else if (language === 'glsl') {
                    if (group === 1 || group === 2) tokens.push(['comment', value]);
                    else if (group === 3) tokens.push(...preprocessorTokens(value));
                    else if (group === 4) tokens.push(['number', value]);
                    else if (group === 5) tokens.push([classifyGlslIdentifier(text, value, match.index), value]);
                    else tokens.push(['operator', value]);
                } else {
                    if (group === 1)
                        tokens.push(
                            ...(nextSignificantChar(text, last) === ':' ? [['property', value]] : stringTokens(value, true))
                        );
                    else if (group === 2) tokens.push(['number', value]);
                    else if (group === 3) tokens.push(['keyword', value]);
                    else tokens.push(['comment', value]);
                }
            }
            if (last < text.length) tokens.push(['plain', text.slice(last)]);
            return tokens;
        }

        function setCode(element, text, language) {
            element.textContent = '';
            let pendingClass = null,
                pendingText = '';
            const flush = () => {
                if (!pendingText) return;
                if (pendingClass === 'plain') element.append(document.createTextNode(pendingText));
                else element.append(el('span', { class: 'tk-' + pendingClass, text: pendingText }));
                pendingText = '';
            };
            for (const [tokenClass, tokenText] of tokenize(text, language)) {
                if (tokenClass !== pendingClass) {
                    flush();
                    pendingClass = tokenClass;
                }
                pendingText += tokenText;
            }
            flush();
            return element;
        }

        function codeEditor(text, language, onChange) {
            const colored = el('pre', { class: 'editor-colors', 'aria-hidden': 'true' });
            const textarea = el('textarea', { class: 'editor-input', spellcheck: 'false', value: text });
            const paint = () => {
                setCode(colored, textarea.value + '\n', language);
            };
            textarea.addEventListener('input', () => {
                paint();
                onChange(textarea.value);
            });
            textarea.addEventListener('scroll', () => {
                colored.scrollTop = textarea.scrollTop;
                colored.scrollLeft = textarea.scrollLeft;
            });
            paint();
            return el('div', { class: 'editor' }, colored, textarea);
        }

        /* ==========================================================================
           Viewer: WebGL2 for models and materials, 2D canvas for textures, DOM for text assets
           ========================================================================== */
        const VS = `#version 300 es
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNrm; layout(location=2) in vec2 aUV;
uniform mat4 uVP; uniform mat4 uM;
out vec3 vN; out vec3 vP; out vec2 vUV;
void main(){ vec4 w = uM*vec4(aPos,1.0); vP = w.xyz; vN = mat3(uM)*aNrm; vUV = aUV; gl_Position = uVP*w; }`;

precision highp float;
in vec3 vN; in vec3 vP; in vec2 vUV;
uniform vec3 uCam; uniform vec4 uColor; uniform vec3 uEmit; uniform float uMetal; uniform float uRough;
uniform sampler2D uAlbedo; uniform sampler2D uNormal; uniform vec2 uHas; uniform vec4 uSO0; uniform vec4 uSO1; uniform int uMode; uniform int uTransparent;
out vec4 o;
vec3 env(vec3 d, float rough){
          float y = d.y;
          vec3 sky = mix(vec3(0.55,0.62,0.72), vec3(0.16,0.30,0.55), clamp(y,0.0,1.0));
          vec3 gnd = mix(vec3(0.20,0.19,0.18), vec3(0.08,0.08,0.09), clamp(-y,0.0,1.0));
          vec3 c = mix(gnd, sky, smoothstep(-0.08,0.08,y));
          float sun = pow(max(dot(d, normalize(vec3(0.5,0.8,0.6))),0.0), mix(400.0,6.0,rough));

}
vec3 perturb(vec3 N, vec3 p, vec2 uv, vec3 t){
          vec3 dp1 = dFdx(p), dp2 = dFdy(p); vec2 du1 = dFdx(uv), du2 = dFdy(uv);
